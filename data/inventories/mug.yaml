- id: mug-02
  lemma: mug
  pos: verb
  label_zh: 行凶抢劫；当街抢劫
  definition: To assault someone for the purpose of robbing them.
  semantic_signature:
    semantic_type: action
    dimension: crime
    change_of_state: false
    causative: false
    valency: transitive
  source_entries:
  - mug-dict-001
  decision:
    type: keep
    reason: This is the main current transitive verb sense. It is syntactically and
      semantically distinct from the intransitive face-making sense and from the police-photography
      sense, so no merge is possible.
  teaching_priority: core
  usage:
    currency: current
    productivity: limited
    register: informal; crime reporting
- id: mug-03
  lemma: mug
  pos: verb
  label_zh: 做鬼脸；夸张地摆姿势（尤指面对镜头或表演时）
  definition: To exaggerate one's facial expression or pose in an affected way, especially
    for a camera or in performance.
  semantic_signature:
    semantic_type: behavior
    dimension: expression
    change_of_state: false
    causative: false
    valency: intransitive
  source_entries:
  - mug-dict-002
  decision:
    type: keep
    reason: The intransitive camera/performance sense is distinct from the transitive
      robbery and photo-ID senses; the examples establish it as a stable, teachable
      extended sense.
  teaching_priority: extended
  usage:
    currency: current
    productivity: limited
    register: informal; theatrical/camera contexts
- id: mug-04
  lemma: mug
  pos: verb
  label_zh: 给（嫌疑人等）拍警方存档照片；拍面部照片
  definition: To photograph someone for official identification; to take a mug shot
    of someone.
  semantic_signature:
    semantic_type: action
    dimension: police_record
    change_of_state: false
    causative: false
    valency: transitive
  source_entries:
  - mug-dict-003
  decision:
    type: keep
    reason: This police/criminal-slang transitive sense is clearly attested and should
      not be merged with mug-dict-002 (intransitive posing) or mug-dict-001 (robbery).
      It is peripheral and partly dated, so it is taught only at recognition level.
  teaching_priority: recognition
  usage:
    currency: dated
    productivity: nonproductive
    register: dated police/criminal slang
