relations:
- source: mug-03
  target: mug-04
  relation: shared_face/photography_context
  distinction: mug-03 is intransitive and performed by the person posing; mug-04 is
    transitive and performed by someone taking an official identification photograph.
- source: mug-02
  target: mug-04
  relation: transitive_person_object_ambiguity
  distinction: Both senses can take a person as object, but mug-02 is street robbery
