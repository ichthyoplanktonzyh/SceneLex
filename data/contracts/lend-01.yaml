semantic_model:
  invariant: lend-01 的经验范畴是：一个当前持有者把具体实物或等值金额的使用/临时占有转移给一个接收者，并在明示或默示的约定下预期以原物或等价物归还，因而整个事件被理解为临时安排而非永久转移。
  necessary_conditions:
  - 存在两个可区分的参与者：一方是当前持有或控制某物的源持有者，另一方是获得该物使用或临时占有的接收者。
  - 转移物是具体实物或可等价归还的金额/同类物；抽象帮助、支持、名声等不属于 lend-01 的转移物。
  - 源持有者将某物的使用或临时占有转移给接收者；接收者获得的是临时使用/占有，而不是所有权。
  - 转移伴随明示或默示的归还条件：接收者需归还同一物品，或归还约定的等价物（如金额）。
  - 整个事件在语境中被理解为临时安排，而非永久转移；不包含‘送给你/不用还了’等永久让渡含义。
  non_entailments:
  - 仅观察到物品从一方转到另一方，并不等于 lend-01；若没有归还条件且事件被理解为永久让渡，则可能是赠与或销售。
  - lend-01 成立并不蕴涵接收者实际归还了物品或等价物；即使事后未归还，只要转移时存在归还条件，该事件仍是 lend。
  - lend-01 成立并不蕴涵永久所有权转移；接收者可以临时持有和使用物品，但物品的归属仍被理解为在源持有者一方。
  - lend-01 成立并不蕴涵源持有者必须亲手把物品交给接收者；接收者自行取走或源持有者允许其取走也可构成转移。
  - lend-01 成立并不蕴涵归还条件必须以话语、借条或日历等显式形式外化；默示的、双方共同理解的归还约定即可。
  - lend-01 成立并不蕴涵源持有者收取利息或报酬；无偿出借仍在本词义内。
  typical_correlates:
  - 源持有者把物品递给接收者、接收者伸手接过：这是常见的交付方式，但接收者自取或源持有者允许取走时也可成立。
  - 双方用语言或借条给出归还提示，如源持有者说‘周五还我’、指向日历或写下借条：这是归还条件常见的外化方式，但默示约定也可成立。
  - 物品上保留源持有者的归属线索，如姓名、标签或原存放位置：这常支持‘临时转移’的解读，但不是每一次 lend 都有可见标记。
  - 接收者使用后把物品放回原处或还给源持有者：这是常见后续结果，但实际归并不是 lend 成立的前提。
  - 借贷场景中源持有者清点金额、记账或留下转账记录，以表明等值归还：这是钱款借贷的常见符号，但不是必要条件。
  misconceptions:
  - id: misc-1
    description: 把中文‘借’的双向用法直接搬进英语，认为 lend 既能表示借出也能表示借入，于是把‘我借你的书’这类方向未标明的表达直接说成 I
      lend your book，方向颠倒。
    correction: 观察事件中谁是源持有者、谁是接收者：如果句子主语是接收者、从对方获得临时使用，该事件不能用 lend 描述；这个反例足以推翻‘lend
      可表示借入’的误解。
  - id: misc-2
    description: 认为 lend 必须看到接收者实际归还才算数；如果对方最后没还，之前的出借就不是 lend。
    correction: 考察转移发生时是否存在归还条件：只要当时双方理解这是临时出借并约定归还，即使事后未归还，该事件仍可判定为 lend-01；实际是否归还不是判定条件。
  - id: misc-3
    description: 认为 lend 只能借出同一件实物，不能用于钱，因为钱被花掉后无法归还同一张钞票。
    correction: 如果场景中借出的是金额并约定归还等值数额，转账、记账或点钞后归还等值现金都可构成 lend-01；归还同一张钞票不是必要条件。
  - id: misc-4
    description: 把 lend support、lend one's name 等抽象用法当成 lend-01，认为帮助或名声也是被临时借出并可归还的物品。
    correction: 用归还测试：若宾语无法设想为需归还的同物或等价物，且没有任何实物从一方转到另一方，则不是 lend-01；这个测试结果可推翻将抽象
      lend 用法归入本词义的预期。
  - id: misc-5
    description: 看到 reflexive 结构如 The room lends itself to meditation，就按 lend-01 理解成房间把使用临时借给了某人。
    correction: 若结构是 reflexive 且不存在可归还的实物或等价物，也没有物品转移，则不属于 lend-01；应归入 lend-02 的‘适用性’义。
  l1_interference:
  - 中文‘借’是一个方向中性的覆盖概念：既覆盖‘借出’也覆盖‘借入’，比 lend-01 更宽；学习者容易把‘我借你的书’直接套成 I lend your book，造成源持有者/接收者映射颠倒。
  - 中文另有‘借给’可明确标出借出方向，但口语中单独出现的‘借’依赖语境决定方向；这种 L1 切割使学习者难以稳定识别 lend-01 的主语必须是提供方。
  - 中文‘提供、赋予’常对应 lend 的抽象义；若把 lend 一律理解成‘借出具体物’，会在 lend support / lend credibility
    等用例中错误地寻找可归还实物，导致对 lend-01 边界的收窄。
