contract_id: notice-01-contract
sense_id: notice-01
lemma: notice
pos: verb
semantic_revision: 1
content_hash: sha256:bf804e472f0fb616d865bf4ab32df23fa227c16272768198445b1d5339295a4a
semantic_model:
  invariant: 一个可感知或可思考的刺激，从一个尚未成为体验者意识焦点的状态，经过一次离散变化，被体验者登记为意识中的一个明确对象。
  necessary_conditions:
  - 存在一个体验者与一个刺激；体验者能够通过感官或心智通达该刺激。
  - 在该事件之前，该刺激还不是体验者意识中的明确对象；即使刺激早已存在于环境中，也不等于已进入意识焦点。
  - 体验者的意识发生变化，使该刺激成为一个明确对象。
  - 最终状态是登记：该刺激被保持在体验者意识中，而不仅仅是在环境中出现。
  - 该情境被呈现为一次离散的发生/转变，而不是持续的状态或习惯。
  non_entailments:
  - 刺激存在于环境中、甚至曾被视线扫过，并不蕴涵'注意到'已经发生；它可以在变化前已经存在却仍未成为意识焦点。
  - 体验者一直看着/盯着刺激，并不蕴涵'注意到'；持续注视可能只是持续注意状态，而不是从无到有的意识变化。
  - '''注意到''成立并不蕴涵体验者会持续留意或继续关注该刺激；notice-01 是一次性变化，不承诺后续的 pay attention。'
  - 体验者没有做出任何外显动作或反应，并不蕴涵'没有注意到'；notice 是内在意识变化，外显行为只是可能的伴随表现。
  - '''注意到''成立并不蕴涵刺激必须来自当前的感官输入；它也可以通过思考完成，例如意识到某个命题成立或推理有问题。'
  typical_correlates:
  - 常伴随：目光先扫过刺激物，然后折返并锁定在刺激物上。
  - 常伴随：头部或视线转向刺激，或正在进行的动作突然停顿。
  - 常伴随：出现 startled、挑眉、表情变化等登记标记。
  - 常伴随：随后做出指向该刺激的动作，如指向、拿起、走近、重新阅读/核对。
  - 常伴随：事后能准确复述或提及刚才的刺激；但这只是可能证据，不是必要条件。
  misconceptions:
  - id: misc-1
    description: 以为'眼睛看到了刺激'就等于'注意到'。
    correction: 要证明是 notice，需要找到刺激成为意识焦点的转变痕迹，例如目光折返并锁定、随后有指向该刺激的行为或事后能报告；若只是视线扫过、没有这些登记痕迹，'看到了'不足以构成
      notice。
  - id: misc-2
    description: 以为 notice 是持续'注意/留意'，可以覆盖一段时间的专注状态。
    correction: 若观察到的是一段持续的留意/监视，且找不到从'未意识到'到'意识到'的离散转变点，或句子可改写为 pay attention to，则不是
      notice-01。
  - id: misc-3
    description: 以为没有任何外显反应就意味着没有注意到。
    correction: notice 是内在意识变化，不承诺动作；即使当下没有外显反应，只要事后能准确报告该刺激，或后续行为明确以该刺激为对象，仍可判定 notice。
  - id: misc-4
    description: 以为注意到的内容必须通过感官（尤其是视觉）获得。
    correction: 定义允许通过 thought 注意到事实或命题；若证据是重新思考后突然意识到某事不对劲/推理有矛盾，即使没有新的感官输入，也满足 notice
      的成立条件。
  - id: misc-5
    description: 以为事先一直盯着刺激或正在监视它就是在 notice。
    correction: notice 要求从'未成为意识焦点'到'成为意识焦点'的变化；若证据显示刺激在整个过程中一直是注意焦点，则缺少这个转变，应归入持续注意/watch，而不是
      notice-01。
  l1_interference:
  - 中文'注意'比 notice-01 更宽：它既覆盖瞬时'注意到'也覆盖持续'留意'；学习者容易用'注意'理解 notice，丢掉'从无到有'的离散变化。
  - 中文'看到'可只表示视觉接收、不承诺刺激成为意识焦点；学习者容易把'看到了'直接等同于'注意到了'，而英文 see 不保证登记到意识中，notice 才保证。
