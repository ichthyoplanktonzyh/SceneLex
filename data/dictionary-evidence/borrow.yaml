- entry_id: borrow-dict-001
  pos: verb
  gloss: To receive (something) from somebody temporarily, expecting to return it.
  labels: []
  examples:
  - Finance is seldom romantic. But the idea of peer-to-peer lending comes close.
    This is an industry that brings together individual savers and lenders on online
    platforms. Those that want to borrow are matched with those that want to lend.
- entry_id: borrow-dict-002
  pos: verb
  gloss: To receive money from a bank or other lender under the agreement that the
    lender will be paid back over time.
  labels: []
  examples: []
- entry_id: borrow-dict-003
  pos: verb
  gloss: To adopt (an idea) as one's own.
  labels: []
  examples:
  - to borrow the style, manner, or opinions of another
  - It is not hard for any man, who hath a Bible in his hands, to borrow good words
    and holy sayings in abundance; but to make them his own is a work of grace only
    from above.
- entry_id: borrow-dict-004
  pos: verb
  gloss: To adopt a word from another language.
  labels: []
  examples:
  - Americans, for example, call newcomers to Antarctica “fingies”, which comes from
    FNGs – a borrowed military abbreviation that means “Fucking New Guy”.
- entry_id: borrow-dict-005
  pos: verb
  gloss: In a subtraction, to deduct (one) from a digit of the minuend and add ten
