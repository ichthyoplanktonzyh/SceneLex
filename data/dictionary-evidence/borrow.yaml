- entry_id: borrow-dict-006
  pos: verb
  gloss: To lend.
  labels:
  - Malaysia
  - Singapore
  - West-Midlands
  - proscribed
  examples:
  - “Rosie, borrow me your look looker, I bet my lips are all. Everytime^([sic]) I
    eat or drink, so quick I gotta fix ’em, yet.”
  - 'Johari Salleh: Ya, ya. Better not waste time. Must prepare, tomorrow morning
