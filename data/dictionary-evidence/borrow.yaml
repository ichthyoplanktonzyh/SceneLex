- entry_id: borrow-dict-007
  pos: verb
  gloss: To temporarily obtain (something) for (someone).
  labels:
  - ditransitive
  examples:
  - 'You must borrow me Garagantua''s mouth first: ''tis a word too great for any
    mouth of this age''s size: To say, ay, and no, to these particulars, is more than
    to answer in a catechism.'
  - Yes, my lord, he told me this in my own house; and I told him he might go to esquire
    Tindal, and I lent him eighteen pence, and borrowed him a horse in the town.
