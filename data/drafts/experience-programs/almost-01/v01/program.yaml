        names a situation that is extremely close to a final point, but the final
        point has not been reached.'' Because this appears at the post-experience
        reveal stage it is a risk rather than a full replacement of experience, but
        it is still learner-visible definitional wording. A safer reveal should point
        to the observed gap, say /ˈɔːlmoʊst/, and show the spelling, leaving the semantic
        explanation outside the learner-visible script.'
