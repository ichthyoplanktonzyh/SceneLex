    多选集合判分。
  special_risks_status:
    surface_vs_interior: learn_09/learn_09b 以否定迁移处理，不命名 through；后续课程可再对比。
    viewpoint_dependence: 本课通过空间舞台固定起点/终点视角，降低视角依赖；未单独设置多视角任务。
