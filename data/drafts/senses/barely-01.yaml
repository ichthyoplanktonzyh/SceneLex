# ============================================================
# A. 基础词义信息
# ============================================================
schema_version: "1.0"
language: en
version: 1
status: draft

id: barely-01
word: barely
pos: adverb
sense_label: 勉强达到/几乎不
definition: "By only a very small margin; almost not; just but not quite fully"

frequency:
  band: mid
  rank: 2200
difficulty: intermediate
pronunciation:
  ipa: /ˈbɛərli/

collocations:
  - barely enough
  - barely visible
  - barely audible
  - barely escaped
  - barely managed
  - barely touched
  - barely alive

sentence_patterns:
  - "barely [verb]"
  - "barely [adjective] enough"
  - "barely [preposition] [noun]"
  - "can barely [verb]"

# ============================================================
# B. 语义类型
# ============================================================
semantic_type: scalar_degree

# ============================================================
# C. 语义骨架
# ============================================================
semantic_skeleton:
  participants:
    - role: measured_event
      description: 被评价的事件、状态或属性
    - role: scale
      description: 该事件所依赖的可度量维度（音量、亮度、距离、数量、完成度等）
    - role: threshold
      description: 说话者参照的预期或充分标准

  propositions:
    - 存在一个正在被描述的事件、状态或属性
    - 该事件/属性在某个可度量的量上极其接近但未达到某个临界标准
    - 该量值处于整个尺度的低端，远低于正常或充分的预期值
    - 说话者强调该量值在“几乎为零”与“勉强存在”之间的边界

# ============================================================
# D. 成立条件与排除条件
# ============================================================
conditions:
  required:
    - 事件/属性在某一可度量的维度上存在但极其微弱
    - 量值低于常规预期的门槛，但尚未完全消失
    - 该量与零值的差距可被观察或推断

  excluded:
    - condition: 事件完全不存在（量值为零），没有任何可感知的实例
      alternative: not-01
    - condition: 事件在正常程度上发生，达到或超过预期标准
      alternative: completely-01
    - condition: 事件存在但量值处于中等水平，没有逼近零值的意思
      alternative: moderately-01

# ============================================================
# E. 概念关系
# ============================================================
relations:
  synonyms:
    - hardly-01
    - scarcely-01
  antonyms:
    - completely-01
    - fully-01
  hypernyms:
    - almost-01
  hyponyms: []
  confusables:
    - hardly-01
    - scarcely-01
    - merely-01
    - only-01
    - just-01

  boundaries:
    - target: hardly-01
      relation: overlaps
      distinction: barely 和 hardly 在“几乎不”意义上高度重叠，但 barely 常带“刚好达到”的色彩，hardly 更偏向“几乎不可能”。两者不可简单互斥。
      diagnostic: 在同一场景中，若强调仍在现行（勉强合格）则 barely 更自然；若强调几乎做不到则 hardly 优先。可通过替换测试观察母语者的倾向。
    - target: scarcely-01
      relation: overlaps
      distinction: scarcely 和 barely 在极低程度上重叠，scarcely 更文学化，常带“稀缺”义，但核心程度维度与 barely 无法严格区分。
      diagnostic: 在非正式口语中 barely 更常见；scarcely 多用于书面语强调不足。
    - target: merely-01
      relation: different_dimension
      distinction: merely 强调“仅仅、只是”，不涉及程度高低的评价；barely 强调“勉强、几乎不”。
      diagnostic: 替换测试：barely enough 改 merely enough 不成立；merely a suggestion 改 barely a suggestion 也不成立。
    - target: only-01
      relation: different_dimension
      distinction: only 强调唯一性或限制，barely 强调程度逼近零；两者可共线但不相同。
      diagnostic: “only five dollars”表示数量少但不要求逼近零；“barely five dollars”表示几乎不到五元。
    - target: just-01
      relation: overlaps
      distinction: just 在“刚好”义上与 barely 接近，但 just 不强调逼近零的程度，范围更宽。
      diagnostic: “just enough”和“barely enough”都成立，但“barely”隐含差点不够。

  l1_confusables:
    zh:
      - l1_term: 几乎不
        covers:
          - barely-01
          - hardly-01
          - scarcely-01
        note: >
          中文“几乎不”覆盖了从“基本不做”到“勉强做到”的连续带，
          没有严格区分“barely”的“刚好达到且差点为零”与“hardly”的“几乎不可能”。
          教学上需要用场景展示程度差异：
          “barely visible”（勉强可见）与“hardly visible”（几乎看不见）在中文中都能用“几乎看不见”，
          但前者暗示你还是看见了，后者强调看不见。
      - l1_term: 勉强
        covers:
          - barely-01
          - scarcely-01
          - grudgingly-01
        note: >
          “勉强”在中文里既表程度低（勉强及格）又表不情愿（勉强同意）。
          barely-01 只表程度低（勉强通过），不能自动带出情感色彩。
          学习者常将中文“勉强”的情感义投射到 barely 上，认为 barely 暗示不情愿——需纠正。
      - l1_term: 仅仅
        covers:
          - merely-01
          - only-01
          - barely-01（少用）
        note: >
          “仅仅”强调小或限量，不强调程度逼近零点。
          中文学习者可能用“仅仅”翻译 barely（如“仅仅及格”），
          但“仅仅及格”更接近“only just passed”，而 barely 强调“差点不及格”。
          需区分数量限制与程度边界。

# ============================================================
# F. 场景要求
# ============================================================
scene_requirements:
  must_show:
    - 一个可被量度的事件、状态或属性（如声音、光线、距离、数量、完成度）
    - 该量值极接近某个临界点或零值
    - 存在一个可感知的参照标准（如正常音量、全长、充分数量）
    - 最好同时展示量值刚好在门槛之上与门槛之下的对比

  must_not:
    - 不能完全展示事件没有发生（无声音、全黑、空无一物）——那是 not
    - 不能展示量值充分充足（响亮、明亮、足够多）——那是 completely/fully
    - 不能展示中等程度——那是 moderately
    - 不能只通过情感语境表达“勉强”之意，如人物不情愿地做某事——那是 reluctantly

  externalization:
    - 音量：人几乎听不到，需要侧耳、靠近声源
    - 光线：物体勉强可见，需要眯眼、手搭凉棚
    - 距离：物体几乎触到但未完全接触（如指尖刚刚碰到）
    - 数量：液体刚过刻度线、人数刚够开赛
    - 完成度：游泳者刚好触壁，身高刚好够到架子
    - 时间：在截止前最后一秒完成
    - 强度：气球几乎爆但未爆，电量在关机前显示1%

  timing: >
    先展示事件或状态在临界状态（几乎消失、刚好达到）的视觉/听觉证据，
    让观众自己感知到“差一点就不成立”的紧张感，
    然后在临界点清晰呈现（如刚触及、声音刚出现）时使用目标词命名。
