schema_version: "1.0"
version: 1
status: draft
id: slow-03-contrast-01
sense_ref: slow-03
scene_type: contrast
contrast_target: slow-04
contrast_relation: mutually_exclusive
title: 自然减速 vs 人为减速
synopsis: 两个并列场景：一个雪橇在冰面上自然减速（slow-03），另一个雪橇被人用手推住减速（slow-04），通过并置凸显施事控制的有无。
target_learner:
  l1: zh
  life_context: campus
surface:
  domain: outdoor-play
  participant_type: child
  setting: icy-slope
teaching_evidence:
  - claim: "slow-03 特征：减速源于环境（摩擦），无施事意图"
    beats: [1, 3]
  - claim: "slow-04 特征：施事主动施加力使物体减速"
    beats: [2, 4]
storyboard:
  - beat: 1
    visual: "（画面左半）一个雪橇从雪坡向下滑，靠近坡底时速度自然减慢，雪地摩擦声明显，雪橇渐渐停住"
    audio: "(滑雪摩擦声渐弱)"
    purpose: "展示 slow-03 的原型——自发减速，无外部施事"
  - beat: 2
    visual: "（画面右半）另一个雪橇正在下坡，一只戴手套的手从侧面伸出，用力按压雪橇表面，雪橇立刻减速停下"
    audio: "（手掌拍击声，雪橇急停声）"
    purpose: "展示 slow-04 的典型——施事主动控制减速"
  - beat: 3
    visual: "两个画面并排定格在最终静止状态，左雪橇停得慢，右雪橇停得快。文字标注：左为 'It slows（自发）'，右为 'He slows it（人为）'"
    audio: "（语音：左场景配音 'It slows.' 右场景配音 'He slows it.'）"
    purpose: "并置对比差异轴：主语是否有宾语、是否人为控制"
  - beat: 4
    visual: "画面切换回左半，雪橇再次自然减速，箭头指向雪橇本体；右半改为施事手部特写，箭头指向手"
    audio: "null"
    purpose: "强化两类场景的骨架差异：主题自身 vs 施事作用于受事"
learning_tasks:
  - type: contrast_choice
    prompt: "以下哪个动作属于‘The car slowed’（自发减速）？"
    choices:
      - "A: 司机踩下刹车踏板，车速下降"
      - "B: 汽车滑行时因路面摩擦速度自然下降"
    expected_answer: "B"
