  gate:
    passed: true
    dimensions:
    - name: semantic_correctness
      verdict: pass
      note: 正向样例 review-1、review-3、review-5 均满足 WordSense 成立条件：有明确可辨识的终点（100%、山顶标志、100
        座满）、实际状态极接近（99%、一步、1 个空座）、最终未达成且结果可见。负向样例 review-2、review-4、review-6 分别落在
        barely/已达、not_yet/approaching、already/reached，但均以“这是否是目标词义”的提问呈现为反例，未被当作 almost
        的正例。
    - name: sense_purity
      verdict: pass
      note: 对照 WordSense 的 excluded/confusables，review-2 的 60=60 及格是 barely/刚好达成区域，review-4
        的 40°C 距 100°C 尚远且结果未知是 not_yet/approaching 区域，review-6 的 GPS 1.0km 到达是 already
        区域；这些是有意设计的反例，没有“无意”滑向相邻范畴。
    - name: definition_leakage
      verdict: pass
      note: learner-visible 内容没有定义式解释 almost，也没有旁白/字幕直接陈述“接近但未达到”。review-1/3/5 的 judgment
        与 evidence 都是行为描述（如 review-3 “one long stride from the marker … never step
        onto the summit rock”），语义由事件本身承载。
    - name: cognitive_noise
      verdict: warn
      note: 主线清晰，但存在轻微无关负担：review-4 的 “induction burner / test kitchen / leaves the
        room”、review-5 的 “usher”、review-3 的 “adjusts her pack” 等细节和低频词不服务于“接近而未达”的比较；review-2
        的 judgment 写“跨过达标线”而 episode 是 60=60，略有歧义。建议 learner-visible 版本把 review-4
        改为普通 “burner”，删除非必要动作，并把 review-2 表述改为“达到及格线并判定为通过”。
    scores:
      semantic_correctness: 9.0
      sense_purity: 9.0
      definition_leakage: 9.0
      cognitive_noise: 7.0
