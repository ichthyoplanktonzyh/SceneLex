  semantic_spec:
    judgment: 把‘极度接近一个明确阈值但未越过’的判断从物理距离迁移到时间事件：一个有时间截止界限的事件，过程进展到终点附近，最终未达成，且结果不是灾难性的负面事件。
    domain: temporal_event
    modality: visual_timer
    measurement_scale: binary_deadline
    final_status: missed
    gap_visibility: explicit_one_unit
    outcome_direction: non_catastrophic
    eventual_action: 'no'
    crossed: 'no'
  sequence: 1
  experience:
    episode: At the end of a long hallway, elevator doors began to close. A man carrying
      a backpack sprinted toward them. When he was a few strides away, the gap between
      the doors was still wide enough for a hand. He lunged forward and stretched
      out his arm, but the doors met before his fingers reached the opening. His palm
      slapped the flat metal surface. The arrow above the doors lit up and the elevator
      moved down.
    observable_evidence:
    - The doors were open when he started running, then the gap shrank as he approached.
    - His outstretched fingers were a few centimeters from the opening when the doors
      met.
    - His palm hit the closed doors with a flat slap.
    - The arrow above the doors lit up and the elevator began to move down.
    surface_dimensions:
    - name: Setting
      baseline: A task measured by distance to a place
      deviation: 'A task measured by time: the closing doors set the deadline'
    - name: Time signal
      baseline: Distance to the target is judged by eye
      deviation: Remaining time is visible as the shrinking gap between the doors
    - name: Gap visibility
      baseline: The remaining gap is one clear unit
      deviation: The gap narrows from a hand-width to nothing in a continuous motion
    - name: Outcome tone
      baseline: Missing the target causes harm or loss
      deviation: Missing the target only means waiting for the next elevator; nothing
        is damaged
  interaction:
    question: What did the scene show?
    answers:
    - id: a1
      text: The man stepped into the elevator while the doors were opening.
      is_correct: false
      feedback: No — the doors were closing, not opening, and he stayed in the hallway.
    - id: a2
      text: The doors shut before the man's hand reached the opening.
      is_correct: true
      feedback: Correct — his hand hit the closed doors and the elevator moved down,
        so he did not get inside.
    - id: a3
      text: The man reached the elevator and held the doors open.
      is_correct: false
      feedback: No — his palm hit the closed doors, and the doors did not reopen.
    - id: a4
      text: The man turned around and walked away before the doors closed.
      is_correct: false
      feedback: No — he ran toward the doors and stretched out his arm; the doors
        closed before he got there.
- id: transfer-3
  role: transfer
  hypothesis_target: null
  preserved_variables:
  - quantitative_threshold
  - final_status
  - gap_visibility
  changed_variables:
  - domain
  - modality
  - measurement_scale
  semantic_spec:
    judgment: 把‘直接观察逼近’迁移到依赖刻度读数的量化阈值：一个可量化的目标量，实际数值非常接近目标但停在目标之下，观察者凭刻度判断未达成。
    domain: quantity_fill
    modality: scale_reading
    measurement_scale: continuous_quantity
    quantitative_threshold: target_amount
    final_status: below_target
    gap_visibility: tick_mark_proximity
    eventual_action: 'no'
    crossed: 'no'
  sequence: 2
  experience:
    episode: A cook needed 500 milliliters of milk for a recipe. She set a clear measuring
      cup on the counter and drew a red line on the outside at the 500 ml mark. She
      tilted the bottle and poured. The milk rose past 300, then 400, then crept toward
      the red line. When the surface was one small tick below the line, she straightened
      the bottle and stopped. The surface settled and stayed there, one small tick
      below the red line.
    observable_evidence:
    - The milk climbed from 300 to 400 to a point one small tick below the red line.
    - The liquid surface stopped moving as the cook straightened the bottle.
    - The gap between the liquid and the red line was one thin tick mark.
    - The cook lowered the bottle onto the counter without adding more milk.
    surface_dimensions:
    - name: Setting
      baseline: A person tries to reach a place before a deadline
      deviation: A cook tries to reach a marked amount on a measuring cup
    - name: Readout
      baseline: The result is read from a completed action
      deviation: The result is read from where the liquid line sits against a numbered
        scale
    - name: Scale type
      baseline: The outcome is yes or no
      deviation: The amount can stop anywhere; the remaining gap is a small part of
        the scale
    - name: Gap visibility
      baseline: The shortfall is one clear unit
      deviation: The liquid surface stops one thin tick below the target line
  interaction:
    question: What was the final amount of milk in the cup?
    answers:
    - id: a1
      text: The milk reached the red line.
      is_correct: false
      feedback: No — the surface stopped below the line, not on it.
    - id: a2
      text: The milk stopped one tick below the red line.
      is_correct: true
      feedback: Correct — the surface settled one thin tick below the line, and the
        cook did not pour any more.
    - id: a3
      text: The milk went above the red line and spilled over.
      is_correct: false
      feedback: No — the cook stopped pouring before the liquid touched the line,
        so nothing spilled.
    - id: a4
      text: The milk stayed below 300 milliliters.
      is_correct: false
      feedback: No — the surface passed 300 and 400 and then stopped below the 500
        mark.
- id: transfer-4
  role: transfer
  hypothesis_target: null
  preserved_variables:
  - goal_relevance
  - final_status
  - crossed
  changed_variables:
  - domain
  - modality
  - state_kind
  - affected_entity
  semantic_spec:
    judgment: 把‘接近但未达成’从一次性事件结果迁移到状态完成度量：一个事物几乎达到完全状态，但最终留下可见缺口，且受影响的实体不是人的动作而是自然物体。
    domain: state_completion
    modality: visual_state_change
    state_kind: natural_gradual
    affected_entity: inanimate_object
    goal_relevance: clear_endpoint
    final_status: incomplete
    gap_visibility: visible_remaining_part
    crossed: 'no'
  sequence: 3
  experience:
    episode: A square ice cube sat on a blue dish in the afternoon sun. Over the next
      hour, its sharp edges became round, and the water in the dish rose as the cube
      shrank. The cube got smaller and smaller until only a piece the size of a thumbtip
      was left. Then a cloud covered the sun, and that last piece stopped changing.
      It stayed there, floating in a shallow pool of water.
    observable_evidence:
    - The ice cube's edges became round and the cube got smaller over time.
    - The water level in the dish rose as the cube shrank.
    - A thumbtip-sized piece remained floating in the water when the sun was blocked.
    - That remaining piece stayed solid and did not shrink any further.
    surface_dimensions:
    - name: Setting
      baseline: A person acts toward a deadline or fills something
      deviation: A natural object changes state by itself in a dish
    - name: Change type
      baseline: Movement or filling stops before a boundary
      deviation: Melting stops before the solid disappears into water
    - name: Affected thing
      baseline: A person controls what happens
      deviation: No one touches the ice; the sun and air drive the change
    - name: Endpoint
      baseline: The boundary is a line or mark to reach
      deviation: The endpoint is the moment when no solid piece remains; a visible
        piece is still there
  interaction:
    question: What was true at the end of the scene?
    answers:
    - id: a1
      text: The ice had melted away, and the dish held only water.
      is_correct: false
      feedback: No — a thumbtip-sized piece of ice was still floating in the water.
    - id: a2
      text: A small piece of ice was still floating in the water.
      is_correct: true
      feedback: Correct — the cube shrank to a thumbtip-sized piece, and that piece
        stayed solid when the sun was blocked.
    - id: a3
      text: The ice cube had grown larger as the afternoon went on.
      is_correct: false
      feedback: No — the cube shrank, and its edges became round as it melted.
    - id: a4
      text: The ice cube stayed the same size the whole time.
      is_correct: false
      feedback: No — the cube got smaller over the hour; only a small piece remained
        at the end.
