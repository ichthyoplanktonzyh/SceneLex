      note: 三个单元均满足 WordSense 的 required conditions：有明确目标界限、实际状态极接近、最终未达成。transfer-2
        中手指距门缝几厘米时门已合上，未进入电梯；transfer-3 中液面停在 500 ml 红线下一小格且不再加奶；transfer-4 中只剩拇指尖大小的冰块且融化停止。没有单元表达
