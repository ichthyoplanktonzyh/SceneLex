    - name: sense_purity
      verdict: pass
      note: 所有 final_status 都在未越界一侧：missed / below_target / incomplete，均不是 barely
        的越过界限，也不是 about 的约略等值，更不是 approaching 的中途或结果未知。transfer-2 特别选择了非灾难性错过电梯，避开了中文“差点”的负面/庆幸语用。
    - name: definition_leakage
      verdict: pass
      note: learner-visible 内容（episode、observable_evidence、interaction 的 question/answers/feedback）都只描述可观察行为，没有旁白式定义或语义标签；feedback
        也仅回指可见结果，如 transfer-2 的 his hand hit the closed doors... did not get inside、transfer-3
        的 surface stopped one thin tick below the line。
    - name: l2_leakage
      verdict: pass
      note: 检查 episode、observable_evidence、answers、feedback、surface_dimensions 后，三个单元均未出现
        almost 或相邻 L2 词（nearly、barely、about、practically、not yet 等）。semantic_model
        内部虽含目标词，但不是揭示前 learner-visible 内容。
    - name: variable_isolation
      verdict: warn
      note: 主要场景的几乎关系判断都有效，但变量登记有内部不一致：transfer-3 把 gap_visibility 列为 preserved，但
        semantic_spec.gap_visibility = tick_mark_proximity，与 transfer-2 的 explicit_one_unit
        不是同一取值，其 surface_dimensions 也把 one clear unit 到 one thin tick 标为 deviation；transfer-4
        的 gap_visibility=visible_remaining_part 则未列入 preserved/changed。另外 transfer-2/transfer-3
        的 crossed=no 未在 preserved_variables 中统一登记。建议统一变量取值粒度并把实际变化的变量列入 changed，避免后续校验误判。
    - name: transfer_novelty
      verdict: pass
      note: 每个 transfer 单元按 surface_dimensions 至少改变两个表面维度并进入不同经验域：transfer-2 到时间截止/错过电梯，transfer-3
        到刻度读数的连续量填充，transfer-4 到自然物状态完成。三单元都保留了 clear boundary + close gap + not crossed，未改变
        almost 的成立条件。
    - name: cognitive_noise
      verdict: warn
      note: 总体清晰，但少量词项会增加不必要的解码负担：transfer-2 的 lunged（及非必要的 carrying a backpack）、transfer-4
