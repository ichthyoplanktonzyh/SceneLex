language_policy:
  policy_version: 1
  learner_l1: zh-CN
  target_l2: en
units:
- id: unit-1
  role: anchor
  hypothesis_target: null
  preserved_variables:
  - target_sense
  - contaminant_origin
  - clean_baseline_deviation
  - state_evaluation
  changed_variables:
  - surface_object
  - contaminant
  - perceptual_evidence
  - coverage
  - intensity
  - spatial_order
  semantic_spec:
    judgment: 判断任务：这个有可见食物油污的餐盘是否属于 dirty-01？
    target_sense: dirty-01
    contaminant_origin: external
    clean_baseline_deviation: present
    state_evaluation: needs_cleaning
    surface_object: white_ceramic_plate
    contaminant: dried_food_grease_and_sauce
    perceptual_evidence: visual_stain
    coverage: partial_area
    intensity: moderate
    spatial_order: not_applicable
  sequence: 1
  experience:
    episode: 一个白色陶瓷餐盘放在水槽边。盘面上残留着干掉的炒菜油渍和褐色的酱汁痕迹，集中在盘子中间和边缘的一侧。餐盘其他部分看得出原本的白净底色。手指摸过油渍处，指腹上留下一层滑腻的光泽。
    observable_evidence:
    - 餐盘中央和一侧边缘有干掉的黄色油渍与褐色酱汁，其余部分露出原本的白瓷底色
    - 手指摸过油渍处后，指腹出现一层滑腻的反光
    - 餐盘放在水槽边，附近没有堆满的杂物
    surface_dimensions:
    - name: 表面对象
      baseline: 白色陶瓷餐盘原本光洁、底色均匀
      deviation: 盘面局部附着干油渍和酱汁，滑腻反光
    - name: 污物来源
      baseline: 餐盘自身不含油污
      deviation: 油渍与酱汁来自外部食物残渣并附着在盘面
    - name: 覆盖范围
      baseline: 整面洁净无附着物
      deviation: 油渍只覆盖盘面中央和一侧边缘的部分区域
    - name: 物品秩序
      baseline: 水槽边无杂物堆叠
      deviation: 周边没有散乱物品，仅有餐盘本身需要清洗
  interaction:
    question: 这个餐盘当前的状态，是否属于“表面附着外来污物、偏离原来的洁净状态”？
    answers:
    - id: a1
      text: 是，盘面有可见的油渍和酱汁，且摸起来滑腻
      is_correct: true
      feedback: 对。盘面附着的是外部食物残渣，原来白净的底色被局部油渍覆盖，这正是表面附着外来污物、偏离洁净状态的情况。
    - id: a2
      text: 不是，餐盘只是放得有点乱
      is_correct: false
      feedback: 不对。水槽边并没有堆满杂物，餐盘的问题不是位置乱，而是盘面本身有油渍和酱汁附着。
- id: unit-2
  role: variation
  hypothesis_target: null
  preserved_variables:
  - target_sense
  - contaminant_origin
  - clean_baseline_deviation
  - state_evaluation
  - spatial_order
  changed_variables:
  - surface_object
  - contaminant
  - perceptual_evidence
  - coverage
  - intensity
  semantic_spec:
    judgment: 判断任务：小孩玩泥后手上沾泥，既看得见泥斑又摸得到颗粒，是否仍属于 dirty-01？
    target_sense: dirty-01
    contaminant_origin: external
    clean_baseline_deviation: present
    state_evaluation: needs_cleaning
    spatial_order: not_applicable
    surface_object: child_hands
    contaminant: garden_mud
    perceptual_evidence: visual_stain_and_tactile_grit
    coverage: multiple_local_spots
    intensity: light
  sequence: 2
  experience:
    episode: 一个小孩从花园里跑回门口，摊开两只手。手心、手指缝里粘着深褐色的湿泥，有的地方能看到泥斑，有的地方是薄薄一层。他搓了搓手指，指腹上能搓出细小的泥粒。
    observable_evidence:
    - 小孩手心与指缝有深褐色湿泥痕迹，颜色与皮肤底色明显不同
    - 小孩搓手指时，指腹搓出细小的泥粒
    - 泥斑分布在两只手掌的多个局部位置，没有覆盖整只手
    surface_dimensions:
    - name: 表面对象
      baseline: 小孩的手洗干净时皮肤呈均匀肤色
      deviation: 手心、指缝出现深褐色泥斑，搓动时掉下泥粒
    - name: 污物来源
      baseline: 手上原本没有泥土
      deviation: 湿泥来自花园土壤，是外部附着物
    - name: 感知方式
      baseline: 手部表面没有肉眼可见的附着物
      deviation: 既能看到泥斑，也能摸到细小的泥粒
    - name: 覆盖范围
      baseline: 整双手洁净
      deviation: 泥斑分布在手掌多个局部，不是整片覆盖
  interaction:
    question: 这个小孩的手，当前状态是否属于“表面附着外来污物、偏离原来的洁净状态”？
    answers:
    - id: a1
      text: 不是，只是手掌上沾了泥
      is_correct: false
      feedback: 不对。沾上的泥土正是外部附着物，它让原本干净的手掌出现可见泥斑和可搓出的泥粒，这已经偏离了洁净状态。
    - id: a2
      text: 是，手心与指缝沾着泥土，还能搓出泥粒
      is_correct: true
      feedback: 对。泥土是来自花园的外部污物，手原本干净，现在出现了泥斑和泥粒，属于表面附着外来污物、偏离洁净状态。
- id: unit-3
  role: perturbation
  hypothesis_target: misc-4
  preserved_variables:
  - target_sense
  - contaminant_origin
  - clean_baseline_deviation
  - state_evaluation
  - spatial_order
  - intensity
  changed_variables:
  - surface_object
  - contaminant
  - perceptual_evidence
  - coverage
  semantic_spec:
    judgment: 判断任务：台面上有一层几乎无色的黏腻残留，看不到明显色斑但摸得到黏，是否仍属于 dirty-01？
    target_sense: dirty-01
    contaminant_origin: external
    clean_baseline_deviation: present
    state_evaluation: needs_cleaning
    spatial_order: not_applicable
    intensity: moderate
    surface_object: kitchen_tabletop
    contaminant: sticky_syrup_residue
    perceptual_evidence: tactile_stickiness_alone
    coverage: local_spot
  sequence: 3
  experience:
    episode: 厨房台面上有一片几乎看不出颜色的区域。表面没有明显色斑，但用手指平贴上去再抬起，指腹会被轻微黏住；移动指尖时能感到一层薄薄的黏腻阻力。用湿布擦过之后，那片区域变得顺滑，指尖不再被黏住。
    observable_evidence:
    - 台面那片区域没有明显色斑，颜色与周围几乎一致
    - 手指平贴后抬起，指腹被轻微黏住
    - 移动指尖时感到黏腻阻力
    - 用湿布擦过后，指尖不再被黏住，台面恢复顺滑
    surface_dimensions:
    - name: 表面对象
      baseline: 厨房台面平时光滑、手指移动无阻力
      deviation: 局部有一层透明黏腻残留，指尖被轻微黏住
    - name: 感知方式
      baseline: 表面无可见或可触的附着物
      deviation: 眼睛看不出明显色斑，但触摸能直接感到黏腻
    - name: 污物来源
      baseline: 台面自身是光滑材质，不含黏性物质
      deviation: 黏腻来自外部泼洒的含糖液体干涸后留在表面
    - name: 覆盖范围
      baseline: 整个台面顺滑
      deviation: 黏腻残留只出现在一个局部区域
  interaction:
    question: 这片台面当前的状态，是否属于“表面附着外来污物、偏离原来的洁净状态”？
    answers:
    - id: a1
      text: 是，虽然看不出色斑，但摸得到黏腻残留
      is_correct: true
      feedback: 对。外来的残留物让台面从顺滑变得黏手，视觉上看不出来，但触觉能直接感知到，这正是表面附着外来污物、偏离洁净状态。
    - id: a2
      text: 不是，看不见颜色变化就不算
      is_correct: false
      feedback: 不对。判断附着物不一定非要看见颜色；指尖被黏住、擦后恢复顺滑，说明表面确实有外来的黏性残留。
- id: unit-4
  role: perturbation
  hypothesis_target: misc-5
  preserved_variables:
  - target_sense
  - contaminant_origin
  - clean_baseline_deviation
  - state_evaluation
  - spatial_order
  - perceptual_evidence
  changed_variables:
  - surface_object
  - contaminant
  - coverage
  - intensity
  semantic_spec:
    judgment: 判断任务：白衬衫上只有一个小咖啡渍，是否仍属于 dirty-01？
    target_sense: dirty-01
    contaminant_origin: external
    clean_baseline_deviation: present
    state_evaluation: needs_cleaning
    spatial_order: not_applicable
    perceptual_evidence: visual_stain
    surface_object: white_shirt
    contaminant: coffee_stain
    coverage: single_small_spot
    intensity: mild
  sequence: 4
  experience:
    episode: 一件白色衬衫搭在椅背上。衬衫前襟靠近下摆的位置有一个指甲盖大小的浅褐色咖啡渍，边缘颜色略深。衬衫其余部分保持白色，没有其他斑点。
    observable_evidence:
    - 白色衬衫前襟下摆处有一个指甲盖大小的浅褐色咖啡渍
    - 咖啡渍边缘颜色比中间略深
    - 衬衫其余部分仍是白色，没有其他斑点
    surface_dimensions:
    - name: 表面对象
      baseline: 白衬衫整体白色、无斑点
      deviation: 前襟出现一个浅褐色咖啡渍，边缘颜色略深
    - name: 污物来源
      baseline: 衬衫布料本身不含咖啡成分
      deviation: 咖啡渍来自外部液体洒落并渗入布料
    - name: 覆盖范围
      baseline: 整件衬衫无附着物
      deviation: 只有一个小斑点，面积很小，其余部分仍白净
    - name: 程度
      baseline: 布料原本无颜色差异
      deviation: 斑点颜色浅、面积小，属于轻微痕迹
  interaction:
    question: 这件白衬衫当前的状态，是否属于“表面附着外来污物、偏离原来的洁净状态”？
    answers:
    - id: a1
      text: 是，前襟有一个咖啡渍
      is_correct: true
      feedback: 对。咖啡渍是外部液体留下的附着物，它让原本全白的衬衫出现了一个色斑，即使只有一小块，也已经偏离了原来的洁净状态。
    - id: a2
      text: 不是，只有一个斑点，不算
      is_correct: false
      feedback: 不对。判断依据不是斑点面积的大小；一个外来咖啡渍附着在白衬衫上，就已经让表面偏离了原本的洁净状态。
- id: unit-5
  role: discrimination
  hypothesis_target: misc-1
  preserved_variables:
  - target_sense
  - contaminant_origin
  - clean_baseline_deviation
  - state_evaluation
  - perceptual_evidence
  - intensity
  changed_variables:
  - surface_object
  - contaminant
  - coverage
  - spatial_order
  semantic_spec:
    judgment: 判断任务：在散乱但表面干净的房间与物品整齐但有泥脚印的客厅地板之间，哪一样属于 dirty-01？同时确认 dirty-01 与 messy
      是两条独立维度。
    target_sense: dirty-01
    contaminant_origin: external
    clean_baseline_deviation: present
    state_evaluation: needs_cleaning
    perceptual_evidence: visual_stain
    intensity: moderate
    surface_object: living_room_floor
    contaminant: muddy_footprints
    coverage: multiple_footprints
    spatial_order: neat
    contrast_detail:
      messy_only:
        surface_contaminant_presence: absent
        spatial_order: scattered
        dirty_verdict: 'false'
        messy_verdict: 'true'
      dirty_neat:
        surface_contaminant_presence: present
        spatial_order: neat
        dirty_verdict: 'true'
        messy_verdict: 'false'
  sequence: 5
  experience:
    episode: 客厅里有两个相邻的场景。左边房间：书本、遥控器、抱枕散落在地板和沙发上，但地板上看不到任何污渍或灰尘。右边客厅：拖鞋整齐地摆在门口，沙发靠垫摆放端正，但从门口到沙发之间的浅色地板上留着一串深褐色泥脚印，脚印边缘还能看到细泥渣。
    observable_evidence:
    - 左边房间地板干净无污渍，但书本、遥控器、抱枕散落各处
    - 右边客厅物品摆放整齐，但浅色地板上有一串深褐色泥脚印
    - 泥脚印边缘散落着细小的泥渣
    surface_dimensions:
    - name: 表面对象
      baseline: 浅色地板原本干净、无深色痕迹
      deviation: 地板出现一串深褐色泥脚印和细泥渣
    - name: 物品秩序
      baseline: 物品应放在固定位置
      deviation: 左边房间多处物品散落；右边客厅物品整齐
    - name: 污物来源
      baseline: 地板自身无泥土
      deviation: 泥脚印是外部泥土被踩过后带到地板上的附着物
    - name: 覆盖范围
      baseline: 整块地板无痕迹
      deviation: 泥脚印从门口延伸到沙发前，呈一串局部痕迹
  interaction:
    question: 在这两个场景中，哪一样最符合“表面附着外来污物、偏离原来的洁净状态”？
    answers:
    - id: a1
      text: 左边房间——东西散落但地板干净
      is_correct: false
      feedback: 不对。左边地板没有污物，问题只是物品位置散乱；这只是位置秩序的问题，不是表面附着外来污物。
    - id: a2
      text: 右边客厅——物品整齐但有泥脚印
      is_correct: true
      feedback: 对。右边物品虽然整齐，但浅色地板上有一串外来泥土脚印和泥渣，附着物让地板偏离了原本洁净的状态。
- id: unit-6
  role: discrimination
  hypothesis_target: misc-2
  preserved_variables:
  - target_sense
  - contaminant_origin
  - clean_baseline_deviation
  - state_evaluation
  - perceptual_evidence
  - spatial_order
  changed_variables:
  - surface_object
  - contaminant
  - coverage
  - intensity
  semantic_spec:
    judgment: 判断任务：轻微积尘是否已足以属于 dirty-01？重度油污结垢是否仍可属于 dirty-01，只是更适合 filthy/grimy？
    target_sense: dirty-01
    contaminant_origin: external
    clean_baseline_deviation: present
    state_evaluation: needs_cleaning
    perceptual_evidence: visual_stain
    spatial_order: not_applicable
    surface_object: kitchen_tile_wall
    contaminant: loose_dust_film
    coverage: even_thin_layer
    intensity: slight
    contrast_detail:
      mild_case:
        contaminant: loose_dust_film
        severity: slight
        dirty_verdict: 'true'
        filthy_better_fit: 'false'
      severe_case:
        contaminant: thick_caked_grease
        severity: severe
        dirty_verdict: 'true'
        filthy_better_fit: 'true'
        grimy_supported: 'true'
  sequence: 6
  experience:
    episode: 厨房的一面浅色瓷砖墙，离灶台较远的位置覆盖着一层薄薄的浮尘。用指尖横向划过墙面，指尖侧面会沾起一小层灰；用手电筒斜照时，能看到灰尘颗粒在光线下浮动。同一面墙靠近灶台的位置则有另一处状态：油污结成深黄色的厚垢，表面发亮，需要用铲刀才能刮掉。
    observable_evidence:
    - 远灶台处瓷砖表面有一层薄浮尘，手电斜照能看到颗粒
    - 指尖划过墙面后，指侧沾起一小层灰
    - 靠近灶台处有深黄色厚油垢，表面发亮，需用铲刀才能刮掉
    surface_dimensions:
    - name: 表面对象
      baseline: 浅色瓷砖墙原本平整、无覆盖物
      deviation: 一部分区域覆盖薄浮尘，另一部分区域结着深黄色厚油垢
    - name: 程度
      baseline: 墙面无任何附着物
      deviation: 浮尘层较薄，油垢层较厚且发亮，两种程度差异明显
    - name: 感知方式
      baseline: 墙面色泽均匀、无颗粒感
      deviation: 浮尘在斜照光下可见，指尖能沾起灰；油垢肉眼可见并形成硬壳
    - name: 覆盖范围
      baseline: 整面墙无附着物
      deviation: 浮尘呈薄薄一层覆盖部分区域，油垢集中在一处灶台附近
  interaction:
    question: 这两处墙面状态，哪一句说得对？
    answers:
    - id: a1
      text: 薄浮尘那处已经是表面附着外来污物，厚油垢那处也同样是
      is_correct: true
      feedback: 对。薄浮尘和厚油垢都是外来附着物，都让瓷砖墙偏离了原本洁净的状态；程度轻或重都不改变这一点。
    - id: a2
      text: 只有厚油垢那处才算，薄浮尘太轻了不算
      is_correct: false
      feedback: 不对。薄浮尘虽然轻，但手电照得到颗粒、指尖能沾起灰，说明表面确实附着外来灰尘；程度轻也仍然属于表面附着外来污物。
- id: unit-7
  role: discrimination
  hypothesis_target: misc-3
  preserved_variables:
  - target_sense
  - contaminant_origin
  - clean_baseline_deviation
  - state_evaluation
  - perceptual_evidence
  - intensity
  - spatial_order
  changed_variables:
  - surface_object
  - contaminant
  - coverage
  semantic_spec:
    judgment: 判断任务：表面有泥水溅落的台面、内容粗俗的言语、被污染的水体，哪一个属于 dirty-01？另外两个应分别归入其他范畴。
    target_sense: dirty-01
    contaminant_origin: external
    clean_baseline_deviation: present
    state_evaluation: needs_cleaning
    perceptual_evidence: visual_stain
    intensity: moderate
    spatial_order: not_applicable
    surface_object: kitchen_counter
    contaminant: muddy_splashes
    coverage: scattered_splashes
    contrast_detail:
    - case_type: dirty-02
      object_of_judgment: spoken_content
      surface_contaminant_presence: absent
      dirty01_verdict: 'false'
      category_verdict: dirty-02
    - case_type: polluted
      object_of_judgment: river_water
      surface_contaminant_presence: not_surface_attachment
      dirty01_verdict: 'false'
      category_verdict: polluted
  sequence: 7
  experience:
    episode: 厨房台面上有深褐色泥水溅落的痕迹，泥点沿台面边缘散开，干后留下粗糙的泥痕。旁边有人在讲一个笑话，说完后周围人皱起眉头，有人说“这话不该在这里说”。远处电视新闻里播放着一条河的画面：河面上漂着白色泡沫，水体呈灰绿色。
    observable_evidence:
    - 台面边缘有深褐色泥水溅落后干掉的粗糙泥痕
    - 有人讲笑话后，周围人皱眉并说“这话不该在这里说”
    - 电视画面中的河水呈灰绿色，河面漂着白色泡沫
    surface_dimensions:
    - name: 表面对象
      baseline: 台面原本平整、无深色痕迹
      deviation: 台面边缘出现深褐色泥痕和粗糙泥点
