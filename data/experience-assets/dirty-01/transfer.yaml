  sequence: 3
  experience:
    episode: 浴室的镜子挂在洗手台上方。镜面上散落着十几处白色小点，大小不一，边缘有的带着细小的沫状突起。其中一片区域被人用布擦过，留下一条清晰的亮条纹，条纹经过的地方白色小点消失，露出原本银亮的镜面；条纹两侧仍保留着成片的白色斑点。镜子没有裂纹，边角完好。
    observable_evidence:
    - 镜面上散落着十几处白色小点，大小不一，部分边缘带沫状突起。
    - 一条亮条纹斜穿过镜面，条纹内没有白色小点，露出银亮反光。
    - 亮条纹两侧仍保留着成片白色斑点，斑点没有扩散或流挂。
    - 镜子玻璃完好，没有裂纹或缺口。
    surface_dimensions:
    - name: 表面材质
      baseline: 镜面是平整的玻璃，表面均匀反光
      deviation: 镜面虽然平整反光，但分布着白色小点，局部反光被遮挡
    - name: 附着物形态
      baseline: 镜面上没有可见的外来物
      deviation: 有十几处白色小点，大小不一，边缘带沫状突起，呈飞溅状分布
    - name: 感知通道
      baseline: 只需眼睛就能确认表面是否与周围相同
      deviation: 所有异常都通过眼睛直接看到，没有借助触摸或嗅觉
    - name: 擦拭痕迹
      baseline: 镜面上没有近期被擦拭的痕迹
      deviation: 一条布擦过的亮条纹穿过斑点区，条纹内斑点消失，两侧仍保留斑点
  interaction:
    question: 根据你看到的镜面现象，哪种说法符合实际情况？
    answers:
    - id: a1
      text: 镜面上有白色斑点，但一处被擦过后露出了原本的银亮反光，说明斑点只是附着在镜面上。
      is_correct: true
      feedback: 对——白色小点散布在镜面上，被布擦过的条纹里斑点消失并露出银亮镜面，说明外来附着物覆盖了表面，而且可以被擦掉。
    - id: a2
      text: 镜面上的白色斑点是镜子玻璃自身长出来的花纹，擦不掉。
      is_correct: false
      feedback: 不对——被布擦过的条纹里白色小点消失了，露出银亮反光，说明斑点来自表面附着物，而不是玻璃自身的变化。
