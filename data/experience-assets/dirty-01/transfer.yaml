  sequence: 1
  experience:
    episode: 花园角落的墙边装着一个金属水龙头。水龙头表面原本是光亮的银灰色。一根树枝从上方垂下来，正对着水龙头。走近看，水龙头的顶部和开关把手上有几处灰白色、带颗粒的斑块，形状不规则，边缘翘起。水龙头本身没有生锈，也没有破损，金属部分完好。
    observable_evidence:
    - 水龙头顶部和开关把手上有几处灰白色、带颗粒的斑块，边缘翘起。
    - 斑块下方的金属表面完好，没有锈迹或裂纹。
    - 上方的树枝正对着水龙头，附近地面上也有少量同样的灰白痕迹。
    - 斑块边缘没有水冲过或布擦过的迹象。
    surface_dimensions:
    - name: 附着物形态
      baseline: 表面没有可见的外来物，露出均匀的银灰色金属光泽
      deviation: 顶部与把手上出现多处灰白色、带颗粒、边缘翘起的斑块
    - name: 环境关联
      baseline: 水龙头周围地面上没有与表面相似的痕迹
      deviation: 水龙头位于花丛与下垂树枝之间，地面也有同样的灰白痕迹
    - name: 擦拭痕迹
      baseline: 表面没有近期被擦拭或冲洗留下的条纹
      deviation: 斑块边缘没有水冲过或布擦过的迹象
  interaction:
    question: 根据你刚才观察到的水龙头表面，哪种说法符合实际情况？
    answers:
    - id: a1
      text: 表面有灰白色颗粒斑块，斑块下方金属完好，需要擦拭才能恢复原先的光泽。
      is_correct: true
      feedback: 对——水龙头顶部和把手上的灰白斑块附着在金属表面上，下方金属没有破损；斑块使原本光亮的表面偏离了常态。
    - id: a2
      text: 表面没有外来附着物，只是旁边的工具和花盆没有放回原来的位置。
      is_correct: false
      feedback: 不对——你看到的是水龙头表面有灰白颗粒斑块，而不是周围物品摆放位置的问题；物品位置不在本单元要判断的表面状态里。
