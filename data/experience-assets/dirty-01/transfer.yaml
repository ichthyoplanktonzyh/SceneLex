  sequence: 2
  experience:
    episode: 厨房的浅色台面上，乍看只有几处很淡的反光，没有明显的斑点或痕迹。走近后，手掌平贴上台面，能感到一小片区域发黏；手指抬起时，指尖和台面之间拉起一根细丝。同时一股发酸的气味从台面飘上来。这片区域周围没有抹布，也没有水渍。台面本身平整完好，没有裂缝或破损。
    observable_evidence:
    - 从正上方看，异常区域只有很淡的反光差异，没有明显色斑。
    - 手掌平贴台面后抬起，指尖和台面之间拉起一根细丝。
    - 靠近台面能闻到一股发酸的气味，气味位置与发黏区域重合。
    - 台面平整完好，附近没有抹布、海绵或擦拭留下的痕迹。
    surface_dimensions:
    - name: 视觉可辨度
      baseline: 台面颜色均匀，只需看一眼就能分辨表面是否与周围相同
      deviation: 正上方看只有很淡的反光差异，眼睛几乎看不出问题
    - name: 感知通道
      baseline: 异常与否只靠眼睛就能确认
      deviation: 眼睛看不出差别，手掌贴上后感到局部发黏，靠近后闻到酸味
    - name: 环境位置
      baseline: 厨房台面上没有明显的气味来源或黏腻区域
      deviation: 台面中间位置出现一片摸起来发黏的区域，同时有持续酸味
    - name: 擦拭痕迹
      baseline: 台面上没有近期被擦拭或冲洗留下的水痕、布纹
      deviation: 黏腻区域边缘没有擦痕，附近也没有抹布、海绵等工具
  interaction:
    question: 根据你看到、摸到和闻到的现象，这个台面处于哪种情况？
    answers:
    - id: a1
      text: 台面只是有几道反光，表面和周围没有差别。
      is_correct: false
      feedback: 不对——虽然从正上方看不太明显，但手掌摸到局部发黏、靠近后闻到酸味，说明这一片表面有东西附着，和周围不一样。
    - id: a2
      text: 台面局部摸起来发黏、闻起来发酸，需要处理才能恢复原来平整、无味的状态。
      is_correct: true
      feedback: 对——黏腻触感和酸味都集中在同一片区域，外来附着物改变了台面原本平整、无味的状态，所以应选择这一项。
