  semantic_spec:
    judgment: 判断：水槽台面上的厨具与调料瓶是否处于整体可见的无序排列，而不是因为残留污渍被归为脏。
    observed_entity: 厨房水槽台面
    setting: 厨房
    surface_condition: 表面有油污水渍
    component_type: 厨具、锅盖与调料瓶
    deviation_type: 物品散放、相互交叠、朝向不一
    quantity_pattern: 少而乱
    contrast_state: 无整洁对照
  sequence: 2
  experience:
    episode: 厨房水槽边的台面上只放着四件东西：一把锅铲、一个玻璃锅盖、两只调料瓶。锅铲斜搭在倒扣的锅盖上，一只调料瓶横躺在水槽边沿，另一只立在台面远端。锅铲与锅盖相互交叠，两只瓶子的瓶口朝向相反方向。台面上可见几处油渍和水痕，从锅盖边缘延伸到水槽边。视野内没有其他可作对照的台面。
    observable_evidence:
    - 锅铲斜搭在倒扣的锅盖上，两者相互交叠
    - 一只调料瓶横躺在水槽边沿，另一只立在台面远端，瓶口朝向相反
    - 玻璃锅盖倒扣，锅铲的握柄悬在台面边缘外
    - 台面可见油渍和水痕，分布不规则
    - 视野内没有另一个归位台面可作对照
    surface_dimensions:
    - name: 物品位置与朝向
      baseline: 厨具和调料瓶通常放在固定区域，锅盖正放，瓶身竖直
      deviation: 四件物品分散在台面各处，锅盖倒扣、一瓶横躺、锅铲斜搭交叠，瓶口朝向不一
    - name: 表面清洁状况
      baseline: 厨房台面通常保持干燥、少油污
      deviation: 台面有可见油渍和水痕，分布不规则
    - name: 物品数量分布
      baseline: 物品数量少时容易形成有序排列
      deviation: 物品数量少却分散在多个位置，彼此交错
    - name: 对照状态
      baseline: 场景中有可比较的归位台面
      deviation: 视野内没有可比较的台面
  interaction:
    question: 你看到的这处厨房台面，更接近哪一种状态？
    answers:
    - id: a1
      text: 台面上有几处水渍，但所有物品都放在各自原本的位置，方向和位置保持一致
      is_correct: false
      feedback: 不对。你看到的是锅铲斜搭在倒扣锅盖上、一只调料瓶横躺、瓶口方向相反；这些位置和朝向偏差与台面水渍无关。
    - id: a2
      text: 台面上物品不多，但位置分散、朝向不同，锅铲与锅盖还相互交叠
      is_correct: true
      feedback: 正确。锅铲与锅盖交叠、瓶口朝向相反、锅盖倒扣，这些可见的位置和朝向差异说明物品没有保持在各自原来的归位状态。
- id: transfer-3
  role: transfer
  hypothesis_target: null
  preserved_variables:
