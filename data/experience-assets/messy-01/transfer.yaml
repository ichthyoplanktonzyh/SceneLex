  semantic_spec:
    judgment: 判断：一个开放的储物格整体是否呈现可见的杂乱形态，并排除表面损坏或物品过多但整齐的情形。
    observed_entity: 储物格内部空间
    component_type: 鞋子与鞋盒
    contrast_state: 有整洁对照
    setting: 玄关鞋柜
    surface_condition: 干净无污渍
    deviation_type: 位置错位、开口方向不一、相互挤压
    quantity_pattern: 数量多但未溢出
  sequence: 3
  experience:
    episode: 玄关的鞋柜分成上下两格。下格里放着六双鞋和三只鞋盒：一双运动鞋横着卡在格子中间，一只皮鞋鞋头朝里、另一只皮鞋鞋头朝外；三只鞋盒的开口分别朝左、朝上和斜前方，盒盖半开，相互挤压。上格则是一排鞋头统一朝外、间隔均匀的鞋，看起来保持着原样。柜体内没有灰尘，也没有泥土或污渍。
    observable_evidence:
    - 下格中一双运动鞋横着卡在格子中间，没有与其他鞋同向摆放
    - 下格中一只皮鞋鞋头朝里，另一只皮鞋鞋头朝外，方向相反
    - 三只鞋盒的开口分别朝左、朝上和斜前方，盒盖半开，相互挤压变形
    - 上格的一排鞋鞋头统一朝外、间隔均匀，形成对照
    - 柜体内没有灰尘、泥土或污渍，表面干净
    surface_dimensions:
    - name: 物品位置与方向
      baseline: 鞋和鞋盒通常按同一方向摆放，盒口朝同一侧
      deviation: 下格中鞋头方向相反、鞋盒开口方向不一，盒体相互挤压变形
    - name: 表面清洁状况
      baseline: 柜体内无尘无渍
      deviation: 柜体干净，没有可见灰尘、泥土或污渍
    - name: 物品数量分布
      baseline: 鞋盒和鞋在可容纳范围内按序排列
      deviation: 六双鞋与三只鞋盒把下格填得较满，但没有溢出到柜外
    - name: 对照状态
      baseline: 同一场景中有一个保持原样的区域
      deviation: 上格保持鞋头统一朝外、间隔均匀，下格的偏差因而更明显
  interaction:
    question: 你看到的这个鞋柜，更接近哪一种状态？
    answers:
    - id: a1
      text: 下格里的鞋和鞋盒方向不一致、相互挤压，上格则保持统一方向和均匀间隔
      is_correct: true
      feedback: 正确。你看到下格运动鞋横卡、一双皮鞋鞋头一内一外、鞋盒开口朝左/上/斜前方并互相挤压，而上格鞋头统一朝外，这种对比说明下格整体偏离了原有排列。
    - id: a2
      text: 下格只是放的鞋盒较多，但所有鞋头都朝同一方向，鞋盒也没有相互挤压
      is_correct: false
      feedback: 不对。你看到的是下格中鞋头方向相反、鞋盒开口方向各异且盒盖半开，不是数量多但方向一致的状态。
