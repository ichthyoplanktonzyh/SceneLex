  semantic_spec:
    judgment: 判断：桌子表面是否呈现整体可见的形态无序（messy），而非因数量多或污渍造成的其他范畴。
    observed_entity: 桌子表面
    component_type: 文具与纸张
    setting: 书桌
    deviation_type: 方向、朝向与边缘对齐度
    surface_condition: 干净
    quantity_pattern: 中等偏多
    contrast_state: 无整洁对照
  sequence: 1
  experience:
    episode: 午后的书桌上摊着七八支笔、三本笔记本和几页纸。笔有的指向窗户，有的指向门口，在桌面上分散开来；笔记本互相叠压，书脊朝的方向各不相同。纸张的边缘参差不齐，有一半探出笔记本外面。桌面本身没有污渍，也没有明显的垃圾。整面桌子在视野里没有其他可作对照的台面。
    observable_evidence:
    - 七八支笔在桌面上指向多个方向，笔与笔之间的距离不一，呈散开状态
    - 三本笔记本互相叠压，书脊朝向不同，边缘没有对齐
    - 几页纸从笔记本之间探出，边缘高低不齐，方向不一致
    - 桌面没有油渍、水痕或垃圾，清洁状况正常
    - 视野内没有第二个台面可作对照
    surface_dimensions:
    - name: 排列方向与边缘对齐度
      baseline: 同类的笔、本子和纸通常会朝同一方向摆放，边缘大体平齐
      deviation: 笔的朝向分散，笔记本书脊方向各异，纸张边缘参差，整体缺乏一致方向
    - name: 表面清洁状况
      baseline: 台面无明显污渍、水痕或垃圾
      deviation: 台面干净，没有油渍、水痕或垃圾
    - name: 物品数量分布
      baseline: 物品按习惯归位，数量适中
      deviation: 中等偏多的物品散落在台面各区域，没有集中在收纳位置
    - name: 对照状态
      baseline: 场景中有一个可比较的归位台面
      deviation: 视野内没有可比较的台面，只能依据桌面自身判断
  interaction:
    question: 你看到的这张书桌，更接近哪一种状态？
    answers:
    - id: a1
      text: 桌面上的笔、笔记本和纸朝向各不相同，边缘参差，整体缺少一致的排列方向
      is_correct: true
      feedback: 正确。你看到的是多支笔朝向分散、笔记本书脊方向不同、纸边参差，这些证据共同说明整体排列缺少一致性，而不是只有个别物品偏移。
    - id: a2
      text: 桌面上只有一两件物品略微偏离原位，其余物品都保持同一方向和边缘平齐
      is_correct: false
      feedback: 不对。你看到的证据是笔的朝向分散、笔记本叠压且书脊方向不同、纸边参差，这已经波及整张桌面，不是一两件物品的轻微偏移。
