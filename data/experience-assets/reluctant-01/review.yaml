    dimensions:
    - name: semantic_correctness
      verdict: pass
      note: 六条 review 均忠实于 WordSense 成立条件。review-1 先呈现「被点名做课堂展示」这一可用动作，Priya 的拖步、暂停、手悬停、flat
        voice 让负向意愿在行动过程中可读；review-6 先呈现「向兄弟道歉」的可用动作，Casey 的抬手又放下、转身、叹气、折返让未发生动作时的抵抗可读，且未将“最终未做”当作排除条件。review-2/3/4/5
        的 no 例分别落在未被行动锚定的悲伤、疲劳导致的缓慢、选项间犹豫、无情绪显示的平静拒绝，均符合 WordSense 的 excluded/boundary。
    - name: sense_purity
      verdict: pass
      note: 正例未滑向相邻范畴：review-1 和 review-6 都针对单一已知动作，抵抗来源是内在不愿，没有变成 refuse/unwilling/hesitant。负例是刻意使用相邻范畴作反例而非无意滑移：review-4
        明确定位为 hesitant 的选项间不确定，review-5 为 unwilling/refuse 式的平静拒绝，review-3 为疲劳，review-2
        为未附着于动作的悲伤。
    - name: definition_leakage
      verdict: pass
      note: 六个 episode 的 learner-visible 文本本身没有旁白式说明、字幕、释义或语义标签；目标词和定义式陈述都没有作为场景内容出现。semantic_spec.judgment
        / observable_evidence / surface_dimensions 中的语义总结应保持为内部答案与生成参数，不应被渲染进揭示前内容或反馈文本。
    - name: cognitive_noise
      verdict: warn
      note: review-1 的 episode 使用低频名词 'lectern'，与目标词义无关，可能分散学习者对关键行为证据（拖步、暂停、手悬停、flat
        voice）的注意；建议改为 'front of the room' 或 'teacher's desk'。其余单元未发现无关情节或明显含混歧义。
    scores:
