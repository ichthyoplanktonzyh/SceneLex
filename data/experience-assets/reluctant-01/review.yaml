    action_specificity: none
    social_visibility: private
  experience:
    episode: In a quiet living room at night, Lena sits on the sofa watching a sad
      film. She wipes tears from her cheeks, her mouth is pressed tight, and she stares
      at the screen without moving while the music swells. When the scene ends, she
      reaches for a tissue, blows her nose, and continues watching.
    observable_evidence:
    - Lena wipes tears from her cheeks while the sad scene plays.
    - She stares at the screen without moving.
    - She reaches for a tissue and blows her nose after the scene.
    - No request or task appears in the room at any point.
    surface_dimensions:
    - name: Presence of an available action
      baseline: A specific task is presented that the person could do.
      deviation: No task or opportunity appears; Lena only watches the film.
    - name: Direction of the emotion
      baseline: The person's signs point toward a task they could take on.
      deviation: Her tears and tight mouth point at the film, not at any action.
    - name: Body movement
      baseline: Movement slows or stops in front of a pending task.
      deviation: Lena stays still and absorbed; her only movements are wiping tears
        and taking a tissue.
- id: review-3
  semantic_spec:
    judgment: 复习判断：一个登山者因体力透支而步履缓慢、频繁停下喘气，但他仍渴望并继续登顶；学习者应判断疲劳导致的缓慢不是目标词义的正例。
    is_target_meaning: 'no'
    addresses_misconception:
    - misc-2
    setting: mountain_trail
    experiencer_type: adult_hiker
    task_domain: hiking_to_summit
    behavioral_evidence_profile: heavy_breathing_frequent_stops_smiling_encouraging
    eventual_action: 'yes'
    opportunity_status: presented
    willingness_valence: positive
    cause_source: fatigue
    action_specificity: specific_available_action
    social_visibility: semi_public
  experience:
    episode: On a steep mountain trail, Marco climbs toward the summit with a heavy
      pack. He stops often to breathe, his chest heaving and his legs shaking, and
      he drinks water at every stop. Each time he catches his breath, he grins at
      his friend and waves upward. He keeps climbing slowly and reaches the top smiling.
    observable_evidence:
    - Marco stops often to breathe and drink water.
    - His chest heaves and his legs shake.
    - He grins at his friend and waves upward after each rest.
    - He keeps climbing and reaches the top smiling.
    surface_dimensions:
    - name: Pace
      baseline: Steady, regular climbing.
      deviation: He stops often, breathes heavily, and shakes, then pushes on slowly.
    - name: Signs of enjoyment
      baseline: No signal of how the person feels during the effort.
      deviation: He grins, waves upward, and smiles at the summit instead of showing
        resistance.
    - name: Source of the slow pace
      baseline: Slow movement appears while an available action is approached.
      deviation: The slow pace comes with labored breathing and shaking legs, not
        with behavior aimed away from the climb.
- id: review-4
  semantic_spec:
    judgment: 复习判断：一个顾客在两个口味之间反复比较、犹豫不决，最终未作选择；学习者应判断选项间的不确定不是目标词义的正例（目标词义是对单一已知动作的抵抗）。
    is_target_meaning: 'no'
    addresses_misconception:
    - misc-3
    setting: ice_cream_shop
    experiencer_type: adult_customer
    task_domain: choosing_between_two_flavors
    behavioral_evidence_profile: looks_back_and_forth_tastes_samples_pauses
    eventual_action: 'no'
    opportunity_status: presented
    willingness_valence: not_applicable
    cause_source: uncertainty_between_options
    action_specificity: multiple_available_options
    social_visibility: public
  experience:
    episode: At an ice cream counter, a customer named Sam studies two flavors in
      front of him. He asks for two spoons, tastes one, then the other, then the first
      again. He looks from one tub to the other, scratches his head, and holds the
      scoop over the first tub, then moves it over the second. He finally says he
      cannot choose today and steps away from the counter.
    observable_evidence:
    - Sam tastes one flavor, then the other, then the first again.
    - He looks back and forth between the two tubs.
    - He holds the scoop over one tub, then moves it over the other.
    - He says he cannot choose today and steps away.
    surface_dimensions:
    - name: Decision structure
      baseline: One known action is available and the person resists starting it.
      deviation: Two options are open, and Sam keeps comparing them.
    - name: Direction of attention
      baseline: Attention stays on a single task the person could begin.
      deviation: His attention swings between the two flavors.
    - name: Ending state
      baseline: The action may be finished or left undone while the person's resistance
        stays clear.
      deviation: The counter has a clear endpoint, but Sam just cannot settle between
        the choices.
- id: review-5
  semantic_spec:
    judgment: 复习判断：一个学生收到帮忙搬家的请求后立即平静地拒绝，没有叹气、停顿或情绪挣扎；学习者应判断仅凭决定不做不足以确立目标词义。
    is_target_meaning: 'no'
