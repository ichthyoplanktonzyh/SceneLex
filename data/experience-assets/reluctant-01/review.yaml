  semantic_spec:
    judgment: 复习判断：一个已呈现的课堂陈述机会被行动者完成，但她在走向讲台与开口说话时持续表现出可读的负向意愿；学习者应判断这类动作虽完成但抵抗可读的场景是目标词义的正例。
    is_target_meaning: 'yes'
    addresses_misconception:
    - misc-1
    setting: university_classroom
    experiencer_type: university_student
    task_domain: class_presentation
    behavioral_evidence_profile: slow_walk_to_lectern_flat_voice_eyes_down
    eventual_action: 'yes'
    opportunity_status: presented
    willingness_valence: negative
    cause_source: internal_resistance
    action_specificity: specific_available_action
    social_visibility: public
  experience:
    episode: In a university lecture hall, Priya is called on to present her group's
      findings. She walks down the aisle toward the lectern with short, dragging steps,
      pausing twice to look at her shoes. When she reaches the lectern, her hand hovers
      above the notes for a second before taking them. She speaks in a flat, low voice
      and keeps her eyes on the paper the whole time, then quickly returns to her
      seat.
    observable_evidence:
    - Priya walks to the lectern with short, dragging steps and pauses twice.
    - Her hand hovers above the notes for a second before picking them up.
    - She speaks in a flat, low voice.
    - She keeps her eyes on the paper while presenting.
    - She finishes the presentation and quickly returns to her seat.
    surface_dimensions:
    - name: Approach speed
      baseline: Walking directly to the lectern at a normal pace.
      deviation: Priya drags her steps, pauses twice, and hovers her hand over the
        notes.
    - name: Vocal tone
      baseline: A clear, lively classroom voice.
      deviation: Her voice is flat and low for the whole talk.
    - name: Eye contact
      baseline: Looking at the audience while presenting.
      deviation: She keeps her eyes on the paper and only looks up at the end.
- id: review-2
  semantic_spec:
    judgment: 复习判断：一个人在看悲伤电影时落泪，情绪指向影片内容而非任何可做的动作；学习者应判断不指向动作的悲伤不是目标词义的正例。
    is_target_meaning: 'no'
    addresses_misconception:
    - misc-5
    setting: living_room
