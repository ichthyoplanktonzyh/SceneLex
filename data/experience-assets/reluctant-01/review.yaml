  experience:
    episode: In a dorm hallway, a student named Jordan is asked by a neighbor to help
      carry boxes to the moving truck. Jordan looks up from the phone and says, "Sorry,
      no," in a relaxed voice, then puts the phone away and walks back into the room.
      There is no pause, no sigh, and no change in expression during the answer.
    observable_evidence:
    - Jordan says "Sorry, no" right after the request.
    - His voice is relaxed and his expression does not change.
    - He does not pause or sigh before answering.
    - He walks back into the room after the reply.
    surface_dimensions:
    - name: Emotional display
      baseline: Some visible sign of internal struggle appears while facing the task.
      deviation: No pause, sigh, or facial change appears at all.
    - name: Decision type
      baseline: A choice not to act can still be part of the scene.
      deviation: Jordan makes a quick, calm decision and leaves.
    - name: Response timing
      baseline: A moment of inner conflict may slow the answer.
      deviation: His answer comes immediately, in a relaxed tone.
- id: review-6
  semantic_spec:
    judgment: 复习判断：一个少年走向可用的道歉机会，在门口停下、叹气并转身离开，最终没有道歉；学习者应判断动作未发生并不排除目标词义，停止前的行为使抵抗可读。
    is_target_meaning: 'yes'
    addresses_misconception:
    - misc-1
    setting: home_hallway
    experiencer_type: teenager
    task_domain: apologizing_to_sibling
    behavioral_evidence_profile: stops_at_doorway_sighs_turns_back
    eventual_action: 'no'
    opportunity_status: presented
    willingness_valence: negative
    cause_source: internal_resistance
    action_specificity: specific_available_action
    social_visibility: private
  experience:
    episode: At home, a teenager named Casey stands outside the door of a sibling's
      room to apologize after a fight. He raises his hand to knock, then lowers it.
      He turns away, walks two steps down the hall, and stops. He lets out a long
      sigh, looks back at the closed door, and finally goes to his own room without
      knocking.
    observable_evidence:
    - Casey raises his hand to knock, then lowers it.
    - He turns away and walks two steps down the hall.
    - He stops and lets out a long sigh.
    - He looks back at the closed door, then goes to his own room.
    - He never knocks on the door.
    surface_dimensions:
    - name: Movement toward the opportunity
      baseline: The person moves toward the available action and completes it.
      deviation: Casey moves toward the door, then away, then stops, then leaves.
    - name: Audible signs
      baseline: No notable sound before or during the action.
      deviation: A long sigh comes before he gives up and walks away.
    - name: Final outcome
      baseline: The action is finished, or the resistance stays visible even if it
        is not.
      deviation: The apology never happens, but his approach, stop, and retreat make
        the inner resistance visible.
