    episode: A manager sets a thick report on Dana's desk and points at the clock.
      Dana's hand reaches toward the report, stops, and curls around her coffee mug
      instead. She opens the report, reads a few lines, and stares at the window.
      When the manager walks past, Dana answers in a flat, quiet voice without turning
      around. She picks up her pen and writes in short, slow strokes until the pages
      are covered with notes.
    observable_evidence:
    - Dana's hand reaches toward the report, stops, and curls around her coffee mug
      instead.
    - She reads only a few lines, then stares out the window.
    - Her voice is flat and quiet when the manager walks past.
    - She writes in short, slow strokes and covers the pages with notes.
