schema_version: '1.1'
version: 2
status: reviewed
id: reluctant-01-proto-01
sense_ref: reluctant-01
sense_revision: 1
scene_type: prototype
title: 勉强吃西兰花
synopsis: 饭桌上，妈妈请孩子吃一口西兰花。孩子停住、后靠、把视线移开，伸手的动作一路迟疑；最终他还是自己完成了这一口，全程没有转为主动，抵抗一直看得见。
storyboard:
- beat: 1
  visual: 妈妈把手指向孩子盘中的西兰花，看着孩子等他动作。孩子原本正常坐着，手放在桌面上。
  audio: 妈妈：来，吃一口西兰花。
  purpose: 呈现一个具体、可执行、没有任何外力阻拦的行动机会；指示动作本身已经建立了请求关系。
- beat: 2
  visual: 孩子停住不动，身体微微向后靠，视线从盘子上移开。片刻之后他伸手去拿叉子，手在半途停了一下，动作明显慢于平常。
  audio: null
  purpose: 把「不愿意执行这个动作」外化为可观察的行为——停顿、后撤、视线回避、启动延迟，而不是靠表情或台词。
- beat: 3
  visual: 孩子叉起西兰花，举到嘴边又停了一下，然后自己吃下这一口。他神情平淡地咀嚼，没有转为享受；放下叉子后身体仍稍微后靠。
  audio: null
  purpose: 行动确实发生并由孩子自己完成（区别于 refuse），但低意愿贯穿始终，没有变成主动配合。
teaching_evidence:
- claim: 孩子对「吃这一口」这个行动缺乏意愿——停顿、后靠、视线回避、伸手迟疑；但他最终仍自己完成了动作，且全程没有转为积极主动。
  beats:
  - 2
  - 3
learning_tasks:
- type: scene_recognition
  prompt: 下列三个场景中，哪一个人物是 reluctant（不情愿）？
  choices:
  - 'A: 妈妈让孩子吃西兰花，孩子立刻说 "我不吃！" 然后把盘子推开。'
  - 'B: 妈妈让孩子吃西兰花，孩子停了一下、身体后靠，慢慢伸手拿叉子，最后还是吃了。'
  - 'C: 妈妈让孩子吃西兰花，孩子高兴地说 "好！" 然后大口吃起来。'
  expected_answer: B
  scoring_note: 只有 B 同时包含「对行动缺乏意愿」与「行动最终仍然发生且意愿没有转正」两个要素；A 是 refuse（行动没有发生），C 意愿是正向的。注意判据是对动作的迟疑，不是对食物的厌恶。
