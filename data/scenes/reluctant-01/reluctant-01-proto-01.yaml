schema_version: '1.1'
version: 1
status: reviewed
id: reluctant-01-proto-01
sense_ref: reluctant-01
sense_revision: 1
scene_type: prototype
title: 勉强吃西兰花
synopsis: 饭桌上，妈妈要孩子吃一口西兰花。孩子内心抗拒，但最终还是勉强吃了一小口，身体语言和表情流露出明显的不情愿。
surface:
  domain: family-dining
  participant_type: child
  setting: indoor-home
storyboard:
- beat: 1
  visual: 妈妈指着餐盘里的西兰花，对孩子说话。
  audio: 妈妈：来，吃一口西兰花。
  purpose: 呈现明确的要求，把“吃西兰花”这个具体行动放在孩子面前。
- beat: 2
  visual: 孩子眉头皱起，身体微微向后靠，视线从西兰花上移开。他慢慢伸手去拿叉子，动作明显比平时慢。
  audio: null
  purpose: 用身体语言——皱眉、后靠、视线回避、动作延迟——外化内心的抗拒，避免台词直述。
- beat: 3
  visual: 孩子用叉子叉起一小块西兰花，举到嘴边时停顿了一下，然后只咬下极小的一口，咀嚼时嘴巴微微下撇。放下叉子后，表情带着嫌弃。
  audio: null
  purpose: 动作完成了，但整个过程缓慢、迟疑、接触最小，证明抵抗并未消失，仍然可见。
- beat: 4
  visual: 妈妈看着孩子，屏幕上浮现文字：'reluctant'。
  audio: 画外音（英音）：“Reluctant.”
  purpose: 在行为证据充分呈现后引入目标词，将概念与观察到的状态绑定。
teaching_evidence:
- claim: 孩子内心不情愿——行动上最终做了，但伴随明显的身体拒绝信号（皱眉、后靠、动作延迟、只咬一小口）。
  beats:
  - 2
  - 3
learning_tasks:
- type: scene_recognition
  prompt: 下列三个场景中，哪一个人物是reluctant（不情愿）？
  choices:
  - 'A: 妈妈让孩子吃西兰花，孩子立刻说 "我不吃！" 然后把碗推开。'
  - 'B: 妈妈让孩子吃西兰花，孩子皱眉、身体后退，慢慢拿叉子只咬了一点点。'
  - 'C: 妈妈让孩子吃西兰花，孩子高兴地说 "好！" 然后大口吃起来。'
  expected_answer: B
  scoring_note: 只有 B 同时包含「内部抵抗」与「行动最终发生且抵抗仍可见」两个要素；A 是 refuse（行动没有发生），C 两个要素都不具备。
