# 迁移场景: 跨领域验证抽象概念
# 设计依据: 概念不应绑定在"少年倒垃圾"上 —— 更换参与者类型(动物)
# 与压力类型(社交/自尊), 验证骨架五命题在陌生表面下仍可识别
id: reluctant-01-transfer-01
sense_ref: reluctant-01
scene_type: transfer
title: 洗澡的狗与道歉的人
synopsis: >
  两段小片段: 被牵向浴缸、四爪撑地的狗; 在朋友注视下终于承认
  自己弄坏东西的人。参与者与压力类型全换, 骨架不变。

storyboard:
  - beat: 1
    visual: >
      浴室门口。主人牵着狗绳往里走, 狗四爪撑住地板, 身体后倾,
      被一点点拖着滑过地板——但没有挣脱, 也没有咬绳。
    audio: "Bath time! Come on..."
    purpose: >
      迁移点一——参与者从人换成狗: 压力(主人+绳子)、抗拒(撑地后倾)、
      仍在移动(未终止), 骨架完整而表面全新

  - beat: 2
    visual: 狗最终蹭进浴室, 自己慢慢跨进浴缸, 耳朵耷拉, 眼神哀怨地看着主人。
    audio: "Look at him... so reluctant to get in."
    purpose: 在非人类主体上命名——概念若已抽象, 此处应无障碍

  - beat: 3
    visual: >
      切换: 客厅。朋友举着摔裂的手办问是谁弄的。人物低头搓手,
      张嘴又闭上, 视线躲向窗外, 脚尖转向门口。
    audio: null
    purpose: >
      迁移点二——压力从外部指令换成社交与自尊: 抗拒的对象是"承认"
      这一言语动作, 外化改用视线回避与身体朝向

  - beat: 4
    visual: 人物长叹一口气, 终于抬头看向朋友, 肩膀垮着。
    audio: "...Fine. It was me. I broke it."
    purpose: 行动最终发生(承认了), 但叹气与垮肩标记意愿始终缺席

  - beat: 5
    visual: 朋友接过手办哭笑不得地摇头。
    audio: "He was SO reluctant to admit it."
    purpose: >
      用高频搭配 reluctant to admit 命名——目标动作从物理动作
      迁移到言语动作, 覆盖骨架中 target_action 的最大变化范围

  - beat: 6
    visual: 三画面并置一秒：拖步的少年 / 撑地的狗 / 低头搓手的人。
    audio: "Reluctant. Reluctant. Reluctant."
    purpose: 三个表面完全不同的画面共享同一声音, 逼迫抽象结构浮现

learning_tasks:
  - type: transfer_judgment
    prompt: >
      播放从未出现过的新短片(猫被推向宠物箱边退边进/学生举手抢答/
      员工叹气后按下发送键), 学习者判断 reluctant 是否适用。
  - type: produce
    prompt: >
      播放一段无声短片(孩子被示意分享玩具, 抱紧玩具磨蹭很久后递出),
      引导学习者说出 "He is reluctant to share."
