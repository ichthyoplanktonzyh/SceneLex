schema_version: "1.0"
version: 1
status: reviewed
id: barely-01-proto-01
sense_ref: barely-01
scene_type: prototype
surface:
  domain: communication
  participant_type: adult
  setting: indoor-library
title: 图书馆里的低语
synopsis: >
  两人在图书馆轻声交谈，其中一人的音量不断减弱直到几乎消失；另一人侧耳、靠近，终于勉强捕捉到声音。
  观众先感知“差一点听不到”的临界体验，再听到目标词命名。
storyboard:
  - beat: 1
    visual: >
      安静图书馆，淡黄色灯光。两人隔桌而坐。A 翻书，B 探身向前，嘴唇翕动，但几乎听不见。
    audio: "(极微弱的说话声，几乎不可辨认)"
    purpose: 建立环境音背景，引入一个几乎听不见的声源。
  - beat: 2
    visual: >
      A 皱眉，放下书，目光转向 B 的方向。A 把头侧向 B，同时手搭在耳后，身体前倾。
    audio: null
    purpose: 用外化行为（侧耳、皱眉）表明声音不足，让观众意识到音量在临界点附近。
  - beat: 3
    visual: >
      A 站起身，走到 B 身边，弯腰把耳朵凑到 B 嘴前约十厘米处。此时 B 的嘴唇继续动，
      画面特写 A 的耳朵微微一动——捕捉到了。A 表情由困惑变为恍然，然后微微点头。
    audio: "(B 的说话声突然清晰一丝：『……第 3 章……』，然后音量恢复正常)"
    purpose: 展示“刚好能听到”的临界时刻——声音刚刚跨过感知门槛。观众也同时感受到“差一点就听不到”。
  - beat: 4
    visual: >
      A 坐回座位，拿起笔在书上做记录，语气轻松地转头对 B 说话。
    audio: "Wow, you were barely audible—I could barely hear you from there."
    purpose: 在临界体验已经充分建立后，用角色自然对话给出目标词“barely audible”和“barely hear”，巩固概念。
learning_tasks:
  - type: scene_recognition
    prompt: 听 “barely”，从四段短片中选择最适合描述的一段。
    choices:
      - 一个人大声说话
      - 一个人几乎无声地说话，另一个人侧耳凑近才听到
      - 一个人正常说话，另一个人清楚听到
      - 完全寂静，没有人说话
    expected_answer: 一个人几乎无声地说话，另一个人侧耳凑近才听到
