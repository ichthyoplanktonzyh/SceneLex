schema_version: "1.0"
version: 1
status: reviewed
id: barely-01-contrast-01
sense_ref: barely-01
scene_type: contrast
contrast_target: hardly-01
contrast_relation: overlaps
surface:
  domain: communication
  participant_type: adult
  setting: outdoor-street
title: 两段街角对话
synopsis: >
  相同场景下两个人分别说同一句话，音量依次递减。第一段声音刚好能听到（barely），
  第二段几乎听不到（hardly）。对称结构并置，用角色反应显示差异轴。
storyboard:
  - beat: 1
    visual: >
      街角，交通嘈杂。两人站得很近。一人（C）对另一人（D）说话，声音低沉而稳定。
      画面特写 D 的耳朵：D 微微靠近，眉头不皱，听到后点头。
    audio: "（C 说话声，音量低于周围噪音，但可勉强识别）"
    purpose: 展示听到但勉强——量值刚好在可识别临界之上。用 D 的轻松反应暗示声音虽弱但够了。
  - beat: 2
    visual: >
      同样街角，同样距离。C 重复同样句子，但这次声带几乎没用力——声音近乎耳语。
      D 皱眉、侧头，手拢耳，表情困惑，最终摇头表示没听清。
    audio: "（C 的说话声，几乎被汽车声淹没，仅剩气流声）"
    purpose: 展示几乎听不到——量值在可识别临界之下。两个版本仅在音量上有差别，其他一致。
  - beat: 3
    visual: >
      分屏并置：左屏 D 轻松点头（第一段），右屏 D 皱眉摇头（第二段）。速度相同，画面各留一半。
    audio: "（左）I could barely hear you. （右）I could hardly hear you — hardly at all."
    purpose: 用对称画面+对比命名明确差异轴：barely 表示“听到了（勉强）”，hardly 表示“几乎没听到”。
  - beat: 4
    visual: >
      特写 C 的嘴巴特写：在两段中嘴唇运动完全相同，只是音量不同。
    audio: null
    purpose: 强化“同一事件，仅程度差异”的概念，为 overlaps 关系铺垫。
  - beat: 5
    visual: >
      回到街角实景。C 重新试了一次，这次用中等音量说话——D 立刻清晰接收。
    audio: "（正常音量）Wait — you mean both barely and hardly are possible? （轻笑）"
    purpose: 用幽默收尾，暗示两者不互斥，但偏好不同真实情境。
learning_tasks:
  - type: contrast_choice
    prompt: 播放两段录音（同一句话但音量不同），选出更适合用“barely”的那一段。
    choices:
      - 音量低到几乎听不到，听者最终摇头
      - 音量低到勉强听到，听者点头
    expected_answer: 音量低到勉强听到，听者点头
