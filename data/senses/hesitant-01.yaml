schema_version: '1.1'
language: en
version: 1
status: reviewed
id: hesitant-01
word: hesitant
pos: adjective
sense_label: 犹豫的；有顾虑的
definition: Inclined to pause or hold back before acting, usually because of doubt
  or concern about possible results.
pronunciation:
  ipa: ˈhɛzɪtənt
collocations:
- hesitant to act
- hesitant about the decision
- seem hesitant
- visibly hesitant
sentence_patterns:
- be hesitant to [verb]
- be hesitant about [noun]
- seem hesitant
difficulty: intermediate
inventory:
  word: hesitant
  version: 1
  evidence_digest: sha256:249a141ca336c50a0ac17ef71e1f035e564d2e06bec9f35826d60eaa827f7e77
  sense_id: hesitant-01
  identity_digest: sha256:89e099d2b29628b6d5821bb2fe4bab58905c8720ff59e308e387ba25fb2831a9
semantic_revision: 1
inventory_source_entries:
- hesitant-dict-001
provenance:
  sources:
  - type: dictionary
    citation: https://kaikki.org/dictionary/English/meaning/h/he/hesitant.jsonl
    license: CC-BY-SA
semantic_type: mental_state
semantic_identity:
  semantic_type: disposition
  dimension: caution/hesitation
  change_of_state: false
  causative: false
  valency: predicative (be + hesitant + to-infinitive / about NP)
semantic_skeleton:
  participants:
  - role: experiencer
    description: someone who is in a position to act but does not act immediately
  - role: prospective_action
    description: an action available to the experiencer at that moment
  propositions:
  - There is a prospective action that the experiencer could perform.
  - The experiencer has a doubt, concern, or reservation about performing it.
  - Instead of acting immediately and smoothly, the experiencer delays, pauses, or
    begins in a restrained way.
  - The delay is read as an expression of that doubt or concern.
conditions:
  required:
  - A specific possible action is present for the experiencer.
  - The experiencer holds some reservation, doubt, or sense of caution about that
    action.
  - Observable behavior includes a pause, a tentative start, or restrained movement.
  - The pause is interpreted as coming from the experiencer's own state of caution.
  excluded:
  - condition: The person performs the action immediately and smoothly, with no detectable
      pause or restraint.
  - condition: No specific action is available or identifiably in view; the person
      is merely confused, not holding back from a known action.
  - condition: The person's delay is due solely to not understanding the situation,
      with no sign of concern about acting.
relations:
  antonyms:
  - decisive-01
  confusables:
  - reluctant-01
  - cautious-01
  - indecisive-01
  boundaries:
  - target: reluctant-01
    relation: overlaps
    distinction: hesitant foregrounds a caution-driven pause before acting; reluctant
      foregrounds unwillingness to perform the action.
    diagnostic: If the stated doubt is removed and the person proceeds, the state
      was hesitant; if the person still acts only with visible aversion or after persuasion,
      it is reluctant.
  - target: cautious-01
    relation: overlaps
    distinction: cautious is a manner that can accompany continuous action; hesitant
      is a state of delay or restraint at the point of acting.
    diagnostic: A cautious person can perform the movement slowly and carefully without
      pausing; a hesitant person pauses or holds back before starting.
  - target: indecisive-01
    relation: overlaps
    distinction: hesitant is about a specific action and can dissolve when the concern
      is answered; indecisive is about difficulty settling on a choice.
    diagnostic: When one clear best option is supplied, the hesitant person acts;
      the indecisive person keeps wavering or reopens the choice.
  l1_confusables:
    zh:
    - l1_term: 犹豫
      covers:
      - hesitant-01
      - hesitate-01
      - indecisive-01
      note: 中文‘犹豫’既指当下的迟疑，也可指性格上的优柔寡断。教学时用‘顾虑得到解答后是否立刻行动’来区分 hesitant 与 indecisive。
    - l1_term: 不情愿
      covers:
      - reluctant-01
      - hesitant-01
      note: ‘不情愿’突出不愿意；hesitant 突出顾虑和谨慎，而不是态度上坚决拒绝。场景中如果对方慢但乐意，应选 hesitant。
scene_requirements:
  must_show:
  - An action opportunity is visible, such as an open door, a raised question, or
    a target the person can approach.
  - 'A beat of delay in the body or voice: hand stops mid-reach, eyes shift between
    the action and a source of concern, or the person starts and stops.'
  - A reason for caution that the camera can show or clearly infer, such as a fragile
    object, a visible risk, or uncertain consequences.
  must_not:
  - Do not show the action completed smoothly without any pause between cue and movement.
  - Do not show the person as physically blocked or mechanically prevented; the pause
    must be readable as internal.
  - Do not replace the state with pure confusion; the person must relate to a recognized
    action they could take.
  externalization:
  - Hovering hand or foot before contact, takeoff, or entry.
  - Gaze repeatedly moving between the goal and the source of concern.
  - Tentative speech such as “Well… maybe…” or beginning a sentence and stopping.
  - Tension in shoulders or mouth before the action is finally taken or abandoned.
  timing: Let the audience first see the pause and infer the concern; name the state
    after that hesitation moment and before the person finally acts or turns away.

