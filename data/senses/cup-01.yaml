id: cup-01
word: cup
pos: noun
sense_label: 杯子；饮具
definition: A small handheld concave vessel intended for drinking, typically opaque
  and usually with a handle; the ordinary countable-noun use of cup.
semantic_revision: 1
inventory:
  word: cup
  version: 1
  evidence_digest: sha256:a137da98e325ee09e8ddff33d5308975a8f6b95888730ef17717a2642ad40675
