# ============================================================
# A. 基础词义信息
# ============================================================
schema_version: "1.0"
language: en
version: 1
status: reviewed

id: messy-01
word: messy
pos: adjective
sense_label: 可见的杂乱无序
definition: "Visibly disordered or untidy; lacking an expected arrangement or neat form"

frequency:
  band: mid
  rank: 3200
difficulty: basic
pronunciation:
  ipa: /ˈmɛsi/

collocations:
  - messy room
  - messy desk
  - messy hair
  - messy handwriting
  - messy kitchen
  - get messy

sentence_patterns:
  - "[place/thing] is messy"
  - "a messy [noun]"
  - "look/get messy"
  - "so messy that [clause]"

# ============================================================
# B. 语义类型
# ============================================================
semantic_type: attribute

# ============================================================
# C. 语义骨架
# ============================================================
semantic_skeleton:
  participants:
    - role: observed_entity
      description: 呈现杂乱状态的空间、表面、对象或可见产物
    - role: components
      description: 构成整体外观的物品、部分、线条或细节

  propositions:
    - 存在一个可被整体观察的空间、对象或产物
    - 整体由多个物品、部分、线条或其他可见细节构成
    - 这些组成部分偏离其常规、预期或整齐的排列与形态
    - 组成部分之间缺乏足够的秩序、一致方向或整洁形式
    - 无序达到整体可见的程度，而非只有一个无关紧要的局部偏差

# ============================================================
# D. 成立条件与排除条件
# ============================================================
conditions:
  required:
    - 组成部分的无序状态可被直接观察
    - 无序是相对于该对象或产物的常规整洁状态而言
    - 杂乱是当前可见的状态，不是过程

  excluded:
    - condition: 物品有污渍或不卫生，但排列并不混乱
      alternative: dirty-01
    - condition: 空间只有表面损坏，但物品仍保持整体秩序
      alternative: wrecked-01

# ============================================================
# E. 概念关系
# ============================================================
relations:
  synonyms:
    - untidy-01
    - disordered-01
  antonyms:
    - neat-01
    - tidy-01
    - organized-01
  hypernyms:
    - disorderly-01
  hyponyms: []
  confusables:
    - dirty-01
    - chaotic-01
    - cluttered-01
    - untidy-01
    - sloppy-01

  boundaries:
    - target: dirty-01
      relation: different_dimension
      distinction: messy 判断位置与组织秩序，dirty 判断表面是否有污物；两者可以同时成立。
      diagnostic: 分别固定清洁度和排列秩序，只改变另一维度，观察目标词是否仍成立。
    - target: cluttered-01
      relation: overlaps
      distinction: cluttered 强调物品过多占据空间，messy 强调排列无序；多且乱时两者可以共现。
      diagnostic: 物品很多但分类整齐时 cluttered 可成立而 messy 不一定成立。
    - target: untidy-01
      relation: overlaps
      distinction: 两者高度重叠，untidy 通常更轻或更偏未整理，不能建立绝对互斥边界。
      diagnostic: 使用程度连续变化的样本，测试说话者更自然选择哪个词，而非强迫二选一真值。

  l1_confusables:
    zh:
      - l1_term: 乱
        covers:
          - messy-01
          - chaotic-01
          - disordered-01
          - disorganized-01
        note: >
          中文"乱"的语义范围远大于 messy。
          "乱"可用于物理空间（房间很乱=messy）、
          抽象局面（局势很乱=chaotic）、
          行为秩序（交通很乱=disorderly）。
          messy 在日常英语中主要指可见的物理无序。
      - l1_term: 脏
        covers:
          - dirty-01
          - messy-01
          - filthy-01
        note: >
          中文"脏乱"常连用，导致学习者把 messy 和 dirty 混为一体。
          messy 核心是位置无序（东西不在该在的地方），
          dirty 核心是表面不洁（有污渍、灰尘、细菌）。
          一个房间可以 messy but not dirty（东西乱放但都干净），
          也可以 dirty but not messy（东西整齐但表面很脏）。

# ============================================================
# F. 场景要求
# ============================================================
scene_requirements:
  must_show:
    - 一个可被整体观察的空间、对象或产物
    - 多个组成部分偏离预期位置、方向或整洁形态
    - 整体视觉呈现"一眼就能看出乱"的效果
    - 最好同时展示同一空间的整洁对照状态

  must_not:
    - 不能只展示"脏"而没有位置无序——那是 dirty
    - 不能展示蓄意破坏的场面——那是 wrecked/trashed
    - 不能让空间只是物品稍多但摆放整齐——那是 cluttered
    - 不能只展示一个物品歪了——需要整体性的无序

  externalization:
    - 衣服散落在地板、椅子上而非衣柜里
    - 书本、纸张散乱堆放，没有方向一致性
    - 杯碗放在桌面各处而非归位
    - 鞋子在门口东一只西一只
    - 床铺未整理，被子团成一堆
    - 相同物品出现在不同位置（如笔分散在各处）
    - 头发向多个方向乱翘，缺少整齐轮廓
    - 字迹方向、间距和涂改线条相互交叠，整体难以辨认

  timing: >
    先展示空间全貌让观众自行感知到"乱"，
    然后用目标词为这个可见状态命名。
    可以对比展示整理前后的状态来强化概念边界。

# ============================================================
# G. 教学原型建议 (非权威, 仅供 Holistic Course Author 参考)
# ============================================================
teaching_profile:
  primary_archetype: visible_attribute
  suggested_capabilities:
  - scene_observation
  - evidence_highlight
  - binary_judgment
  - boundary_choice
  - transfer_judgment
  special_risks:
  - conflated_pair
  - l1_compound_脏乱
