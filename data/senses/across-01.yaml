id: across-01
word: across
pos: preposition
sense_label: 横过；跨越
definition: Movement or extension from one side of an intervening object or space
  to the other side.
pronunciation:
  ipa: /əˈkɹɔs/
collocations:
- walk across
- swim across
- run across
- stretch across
- bridge across
sentence_patterns:
- '[noun] [verb] across [noun]'
- There is a [noun] across [noun].
