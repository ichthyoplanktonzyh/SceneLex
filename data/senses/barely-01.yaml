id: barely-01
word: barely
pos: adverb
sense_label: 勉强；几乎不
definition: To a degree that is just above zero; at the very edge of the minimum threshold.
inventory:
  word: barely
  version: 1
  evidence_digest: sha256:7082b61d7bcf4ec63c0212e43feb9a00e6007145016917f573d54468a6403784
  sense_id: barely-01
  identity_digest: sha256:e921544ac1921f10b505e3cdf3edd72526e6c84ed203a9dafae116cbcd7a79b2
inventory_source_entries:
- barely-dict-001
- barely-dict-002
semantic_revision: 1
difficulty: intermediate
pronunciation:
  ipa: /ˈbɛrli/
collocations:
- barely visible
- barely audible
- barely enough
- barely made it
- can barely see
sentence_patterns:
- '[subject] can barely [verb]'
- '[subject] barely [verb]'
- barely [adj]
provenance:
  sources:
  - type: dictionary
    citation: https://kaikki.org/dictionary/English/meaning/b/ba/barely.jsonl
