# ============================================================
# A. 基础词义信息
# ============================================================
schema_version: "1.0"
language: en
version: 1
status: reviewed

id: reluctant-01
word: reluctant
pos: adjective
sense_label: 不情愿地面对某事
definition: "Not willing or eager to do something; feeling resistance or hesitation about it"

frequency:
  band: mid
  rank: 2800
difficulty: intermediate
pronunciation:
  ipa: /rɪˈlʌktənt/

collocations:
  - reluctant to admit
  - reluctant to leave
  - reluctant to change
  - reluctant hero
  - reluctant agreement
  - reluctant smile

sentence_patterns:
  - "be reluctant to [verb]"
  - "a reluctant [noun]"
  - "seem/appear reluctant"
  - "reluctant but [clause]"

# ============================================================
# B. 语义类型
# ============================================================
semantic_type: mental_state

# ============================================================
# C. 语义骨架
# ============================================================
semantic_skeleton:
  participants:
    - role: experiencer
      description: 感受到不情愿的人
    - role: target_action
      description: 人物正在面对、考虑或被要求执行的动作
    - role: motivating_context
      description: 使该动作进入考虑范围的要求、目标、责任或情境

  propositions:
    - 存在一个人物正在面对或考虑的动作
    - 人物对该动作缺乏意愿，内心抗拒
    - 存在某种要求、目标、责任或情境使该动作与人物相关
    - 动作最终可能执行也可能不执行；结果本身不定义这种意愿状态
    - 教学场景需要用迟缓、停顿、表情或身体方向等线索外化内心抵触

# ============================================================
# D. 成立条件与排除条件
# ============================================================
conditions:
  required:
    - 人物对一个具体动作缺乏意愿或感到抗拒
    - 该动作正在被人物面对、考虑或被要求
    - 词义判断针对意愿状态，不能只从最终执行或拒绝结果反推

  excluded:
    - condition: 人物动作缓慢但不存在心理抵触
      alternative: slow-01
    - condition: 人物积极希望执行目标动作，没有意愿上的抗拒
      alternative: eager-01

# ============================================================
# E. 概念关系
# ============================================================
relations:
  synonyms:
    - unwilling-01
    - disinclined-01
  antonyms:
    - eager-01
    - willing-01
  hypernyms:
    - unwillingness-01
  confusables:
    - hesitant-01
    - resistant-01
    - refuse-01
    - unwilling-01

  boundaries:
    - target: hesitant-01
      relation: overlaps
      distinction: hesitant 强调决定或行动的不确定，reluctant 强调缺乏意愿；一个人可以既犹豫又不情愿。
      diagnostic: 分别寻找选择摇摆的证据与意愿抗拒的证据，不能只凭停顿同时推断两者。
    - target: refuse-01
      relation: different_dimension
      distinction: refuse 是拒绝行为，reluctant 是意愿状态；两者可以共现，拒绝结果本身不能证明此前不情愿。
      diagnostic: 画面若只呈现明确说不，可确认 refuse；只有出现回避、拖延等意愿线索时才支持 reluctant。
    - target: unwilling-01
      relation: overlaps
      distinction: unwilling 与 reluctant 高度重叠，reluctant 常带有面对行动但有保留或阻力的语用侧重。
      diagnostic: 用自然语料和母语者判断比较搭配偏好，不把两者当成严格互斥类别。

  l1_confusables:
    zh:
      - l1_term: 不愿意
        covers:
          - reluctant-01
          - unwilling-01
          - refuse-01
        note: >
          中文"不愿意"覆盖从被动抵触到主动拒绝的整个谱系。
          reluctant 偏向"虽然不想但可能还是会做"，
          unwilling 偏向"明确不想做"，
          refuse 偏向"已决定不做并表达出来"。
          中文不强制区分这三层。
      - l1_term: 勉强
        covers:
          - reluctant-01
          - grudging-01
        note: >
          "勉强"侧重结果——最终做了但不情愿。
          reluctant 侧重过程中的心理状态，不要求最终一定执行。

# ============================================================
# F. 场景要求
# ============================================================
scene_requirements:
  must_show:
    - 人物面对一个明确的动作、选择或任务
    - 人物表现出不想做的外部迹象
    - 存在使该动作进入考虑范围的原因（要求、目标、责任、风险等）
    - 可以展示执行或拒绝，但不能把最终结果当作 reluctant 的定义

  must_not:
    - 不能只依赖台词说明心理状态（如让人物直接说"I'm reluctant"）
    - 不能仅凭人物拒绝并离开就断言 reluctant——refuse 与 reluctant 是不同维度
    - 不能仅凭人物长时间权衡就断言 reluctant——hesitant 可能没有意愿抗拒
    - 不能只展示"慢"而没有心理层面的抗拒

  externalization:
    - 动作速度明显减缓、拖延
    - 停顿——在行动前有明显的不动
    - 身体方向——背向任务、侧身、后倾
    - 面部表情——皱眉、抿嘴、叹气
    - 语言上的拖延——"Do I have to?"、叹气后才开始
    - 视线回避——不看任务或发出指令的人

  timing: >
    先展示使动作进入考虑范围的情境和人物的行为反应（抵触外化），
    在意愿抗拒已被画面充分外化、但结果尚未替代心理证据时出现目标词。
