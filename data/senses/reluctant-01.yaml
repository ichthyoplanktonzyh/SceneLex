schema_version: '1.1'
language: en
version: 2
semantic_revision: 1
status: reviewed
id: reluctant-01
word: reluctant
pos: adjective
sense_label: 不情愿的
definition: Unwilling to perform an action that is available to the experiencer, because
  of the experiencer's own internal resistance; the action may still be performed, but
  the unwillingness stays visible while it happens.
frequency:
  band: low
  rank: 9349
difficulty: intermediate
pronunciation:
  ipa: rɪˈlʌktənt
collocations:
- reluctant to [verb]
- reluctant participant
- reluctant hero
- reluctant agreement
sentence_patterns:
- '[noun] is reluctant to [verb]'
- '[noun] feels reluctant about [noun]'
- '[noun] gave a reluctant nod'
semantic_type: mental_state
semantic_skeleton:
  participants:
  - role: experiencer
    description: An animate being capable of having internal attitudes and performing
      actions.
  - role: potential_action
    description: A specific, possible future action that the experiencer could choose
      to perform.
  propositions:
  - There exists an experiencer who is aware of a potential action.
  - The experiencer has an internal state of unwillingness, resistance, or doubt toward
    performing that action.
  - The experiencer either refrains from the action, or if they perform it, they do
    so with hesitation, delay, or lack of enthusiasm that is externally observable.
  - The unwillingness originates from the experiencer's own disposition, not from
    external prohibition or physical inability.
conditions:
  required:
  - The experiencer is consciously considering a specific action.
  - The experiencer's internal attitude toward the action is negative (unwilling/resistant).
  - If the action is performed, the performance is accompanied by observable hesitation
    or lack of genuine willingness.
  excluded:
  - condition: The experiencer is eager or enthusiastic about performing the action.
  - condition: The experiencer is physically unable or externally prevented from performing
      the action.
  - condition: The experiencer performs the action spontaneously without any sign
      of hesitation.
  - condition: The experiencer declines the action for external or procedural reasons
      with no internal resistance; a bare refusal does not by itself establish reluctance.
  - condition: The experiencer moves slowly for reasons unrelated to willingness (age,
      injury, fatigue, or a task that is simply laborious).
  - condition: The experiencer has not understood the request, or no opportunity to
      act has actually been presented.
  - condition: The experiencer feels fear, sadness, or general distress that is not
      attached to a specific action they could take.
relations:
  synonyms:
  - unwilling-01
  - hesitant-01
  antonyms:
  - willing-01
  - eager-01
  confusables:
  - hesitant-01
  - refuse-01
  boundaries:
  - target: refuse-01
    relation: different_dimension
    distinction: refuse names an observable act of declining; reluctant names an internal
      willingness state. They can co-occur, but neither entails the other — someone
      can refuse briskly with no reluctance, and can be deeply reluctant yet comply.
      A depicted refusal is therefore not evidence of reluctance.
    diagnostic: If the scene only shows a clear no, it establishes refuse and nothing
      more; reluctant requires separate willingness evidence — delay, withdrawal, minimal
      contact — attached to an action the experiencer could still take.
  - target: unwilling-01
    relation: overlaps
    distinction: Both describe a lack of desire to act, but reluctant emphasizes emotional
      resistance and internal conflict, whereas unwilling focuses on the decision
      not to act regardless of emotional nuance.
    diagnostic: If the person eventually does the action but with clear emotional
      struggle, reluctant fits better; if they simply refuse or state refusal without
      emotional display, unwilling fits.
  - target: hesitant-01
    relation: overlaps
    distinction: hesitant is about uncertainty over which way to decide; reluctant is
      about lacking the will to do a thing already identified. A person can be both at
      once, so they are not points on one scale.
    diagnostic: Look for the two kinds of evidence separately — wavering between options
      versus resistance to one known action. A pause on its own supports neither.
  l1_confusables:
    zh:
    - l1_term: 不情愿
      covers:
      - reluctant-01
      - unwilling-01
      - hesitant-01
      note: 中文'不情愿'常覆盖 reluctant 和 unwilling 的语义，但 reluctant 更强调内心的抵触情绪（可能仍会做），unwilling
        更强调决定不做，而 hesitant 侧重犹豫。教学时建议通过表情和行动结果区分：reluctant 场景中主角最终可能勉强执行但满脸不情愿，unwilling
        场景中主角直接拒绝，hesitant 场景中主角犹豫不决但可能没有强烈反感。
    - l1_term: 不愿意
      covers:
      - reluctant-01
      - unwilling-01
      note: 中文'不愿意'比'不情愿'更偏向意志层面的否定，常用于 unwilling；reluctant 的场景中若主角说'我不愿意'但行为上服从，可用，但更自然的表达是'不情愿地'。
scene_requirements:
  must_show:
  - A clear triggering event or request that puts a specific, physically available
    action in front of the experiencer.
  - 'The experiencer''s resistance carried by the body rather than by speech: delay
    before moving, withdrawal or lean-away, minimal contact with the object, slowed
    or partial movement.'
  - The action beginning or completing anyway, with the resistance still legible while
    it happens.
  must_not:
  - External force or prohibition that directly prevents the action (e.g., tied up,
    forbidden by authority).
  - The experiencer showing enjoyment or eagerness during the action.
  - The experiencer refusing outright and the action never happening; that scene teaches
    refuse-01.
  - Dialogue, captions, or narration carrying the meaning on their own; with all speech
    removed the behavior must still support reluctant.
  - Facial expression as the sole evidence; a frown alone does not distinguish reluctance
    from fear, sadness, or annoyance.
  - Sensory disgust or dislike of an object as the dominant evidence. reluctant is low
    willingness toward an *action*; if the strongest thing on screen is how unpleasant
    a thing tastes, smells, or looks, the scene teaches disgust, not reluctance.
  - A beat or shot whose purpose is to display the target word, a caption, a definition,
    or a narrator naming it; word presentation belongs to the later teaching layer.
  externalization:
  - 'Facial expressions: downturned mouth, furrowed brows, side-eye.'
  - 'Body language: stepping back, crossing arms, slow or hesitant approach.'
  - 'Vocal tone: sighing, flat or quiet voice, brief negative responses like ''I guess
    so'' or ''If I have to''.'
  timing: Introduce the triggering event first, then hold on the experiencer's resistant
    reaction long enough for it to read, then let the action begin and complete while
    the resistance is still visible. Presenting the target word itself — on screen, in
    narration, or as a caption — is a later teaching/editing concern and must not be
    designed into the scene's beats.
