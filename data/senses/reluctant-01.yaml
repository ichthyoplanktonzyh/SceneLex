schema_version: '1.1'
language: en
version: 3
semantic_revision: 2
status: reviewed
id: reluctant-01
word: reluctant
pos: adjective
sense_label: 不情愿的
definition: Unwilling to perform an action that is available to the experiencer, because
  of the experiencer's own internal resistance. The action may or may not be performed;
  when it is performed, the unwillingness stays visible while it happens.
frequency:
  band: low
  rank: 9349
difficulty: intermediate
pronunciation:
  ipa: rɪˈlʌktənt
collocations:
- reluctant to [verb]
- reluctant participant
- reluctant hero
- reluctant agreement
sentence_patterns:
- '[noun] is reluctant to [verb]'
- '[noun] feels reluctant about [noun]'
- '[noun] gave a reluctant nod'
semantic_type: mental_state
semantic_skeleton:
  participants:
  - role: experiencer
    description: An animate being capable of having internal attitudes and performing
      actions.
  - role: potential_action
    description: A specific, possible future action that the experiencer could choose
      to perform.
  propositions:
  - There exists an experiencer who is aware of an available action or course of action.
  - The experiencer's subjective willingness toward performing that action is negative
    (unwillingness, inner resistance, or aversion to doing it).
  - The negative willingness is supported by observable behavior, but no single behavior
    (delay, sighing, expression, refusal, and so on) is a definitional condition.
  - The action may or may not be performed; "no action in the end" is never excluded.
  - The unwillingness originates from the experiencer's own disposition, not from
    external prohibition or physical inability.
conditions:
  required:
  - The experiencer is consciously facing an available action or course of action.
  - The experiencer's internal attitude toward the action is negative (unwillingness
    or inner resistance; the core invariant).
  - The negative willingness is supported by observable behavior; no single behavior
    (delay, sighing, facial expression, minimal contact, refusal, etc.) is required.
  - The action's eventual performance or non-performance is not part of the definition
    (both outcomes are compatible with reluctant).
  excluded:
  - condition: The experiencer is eager or enthusiastic about performing the action.
  - condition: The experiencer is physically unable or externally prevented from performing
      the action.
  - condition: The action is performed or declined without any observable sign of negative
      willingness; a bare refusal alone does not establish reluctance, and a smooth prompt
      performance with no negative-willingness evidence does not either.
  - condition: The experiencer declines the action for external or procedural reasons
      with no internal resistance.
  - condition: The experiencer moves slowly for reasons unrelated to willingness (age,
      injury, fatigue, or a task that is simply laborious).
  - condition: The experiencer has not understood the request, or no opportunity to
      act has actually been presented.
  - condition: The experiencer feels fear, sadness, or general distress that is not
      attached to a specific action they could take.
relations:
  synonyms:
  - unwilling-01
  - hesitant-01
  antonyms:
  - willing-01
  - eager-01
  confusables:
  - hesitant-01
  - refuse-01
  boundaries:
  - target: refuse-01
    relation: different_dimension
    distinction: refuse names an observable act of declining; reluctant names an internal
      willingness state. They can co-occur, but neither entails the other — someone
      can refuse briskly with no reluctance, and can be deeply reluctant yet comply.
      A depicted refusal is therefore not evidence of reluctance.
    diagnostic: If the scene only shows a clear no, it establishes refuse and nothing
      more; reluctant requires separate negative-willingness evidence attached to an
      action the experiencer could still take — delay, withdrawal, minimal contact,
      sighing, and so on, without requiring any single one of them.
  - target: unwilling-01
    relation: overlaps
    distinction: Both describe a lack of desire to act, but reluctant emphasizes emotional
      resistance and internal conflict, whereas unwilling focuses on the decision
      not to act regardless of emotional nuance.
    diagnostic: If the person eventually does the action but with clear emotional
      struggle, reluctant fits better; if they simply refuse or state refusal without
      emotional display, unwilling fits.
  - target: hesitant-01
    relation: overlaps
    distinction: hesitant is about uncertainty over which way to decide; reluctant is
      about lacking the will to do a thing already identified. A person can be both at
      once, so they are not points on one scale.
    diagnostic: Look for the two kinds of evidence separately — wavering between options
      versus resistance to one known action. A pause on its own supports neither.
  l1_confusables:
    zh:
    - l1_term: 不情愿
      covers:
      - reluctant-01
      - unwilling-01
      - hesitant-01
      note: 中文'不情愿'常覆盖 reluctant 和 unwilling 的语义，但 reluctant 更强调内心的抵触情绪（可能仍会做），unwilling
        更强调决定不做，而 hesitant 侧重犹豫。教学时建议通过表情和行动结果区分：reluctant 场景中主角最终可能勉强执行但满脸不情愿，unwilling
        场景中主角直接拒绝，hesitant 场景中主角犹豫不决但可能没有强烈反感。
    - l1_term: 不愿意
      covers:
      - reluctant-01
      - unwilling-01
      note: 中文'不愿意'比'不情愿'更偏向意志层面的否定，常用于 unwilling；reluctant 的场景中若主角说'我不愿意'但行为上服从，可用，但更自然的表达是'不情愿地'。
scene_requirements:
  must_show:
  - A clear triggering event or request that puts a specific, physically available
    action or course of action in front of the experiencer.
  - Negative willingness carried by observable behavior rather than by speech, in any
    combination of delay before moving, withdrawal or lean-away, minimal contact with
    the object, slowed or partial movement, sighing, turning away, flat voice; no single
    behavior is required.
  - The action may or may not begin or complete; either outcome keeps the meaning
    intact as long as the negative willingness is legible.
  must_not:
  - External force or prohibition that directly prevents the action (e.g., tied up,
    forbidden by authority).
  - The experiencer showing enjoyment or eagerness during the action.
  - A bare refusal with no additional observable sign of negative willingness; refusal
    alone does not establish reluctant. (An outcome where the action never happens is
    NOT excluded when negative willingness is otherwise observable.)
  - Dialogue, captions, or narration carrying the meaning on their own; with all speech
    removed the behavior must still support reluctant.
  - Facial expression as the sole evidence; a frown alone does not distinguish reluctance
    from fear, sadness, or annoyance.
  - The scene treating any single behavior (sigh, delay, frown) as the required sign
    of reluctance; each is only possible evidence, never a definitional condition.
  - Sensory disgust or dislike of an object as the dominant evidence. reluctant is low
    willingness toward an *action*; if the strongest thing on screen is how unpleasant
    a thing tastes, smells, or looks, the scene teaches disgust, not reluctance.
  - A beat or shot whose purpose is to display the target word, a caption, a definition,
    or a narrator naming it; word presentation belongs to the later teaching layer.
  externalization:
  - 'Facial expressions: downturned mouth, furrowed brows, side-eye — possible evidence,
    never required.'
  - 'Body language: stepping back, crossing arms, slow or hesitant approach, turning
    away, pausing at the door.'
  - 'Vocal tone: sighing, flat or quiet voice, brief negative responses like ''I guess
    so'' or ''If I have to'' — possible evidence, never required.'
  - 'No action in the end: stopping before starting, or never engaging with the available
    action, with the reluctance read in the behavior that leads up to the stop.'
  timing: Introduce the triggering event first, then hold on the experiencer's negative-willingness
    behavior long enough for it to read, then close with the willingness state still
    legible — whether the action begins, completes, or never happens. Presenting the
    target word itself — on screen, in narration, or as a caption — is a later
    teaching/editing concern and must not be designed into the scene's beats.
