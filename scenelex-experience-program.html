<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SceneLex — Experience Program Prototype</title>
  <style>
    :root{
      --bg:#f4f4f1;
      --surface:#ffffff;
      --surface-2:#f7f7f4;
      --text:#161616;
      --muted:#73736e;
      --line:#e7e7e1;
      --accent:#111111;
      --good:#166534;
      --bad:#9f1239;
      --shadow:0 24px 70px rgba(0,0,0,.09);
      --radius:28px;
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
    button{font:inherit}
    .app{
      min-height:100vh;
      display:grid;
      grid-template-columns:260px minmax(0,1fr);
    }
    .sidebar{
      border-right:1px solid var(--line);
      padding:28px 22px;
      display:flex;
      flex-direction:column;
      background:rgba(244,244,241,.9);
      position:sticky;
      top:0;
      height:100vh;
    }
    .brand{
      display:flex;align-items:center;gap:10px;
      font-weight:800;letter-spacing:-.03em;font-size:20px;
      margin-bottom:34px;
    }
    .brand-mark{
      width:30px;height:30px;border-radius:9px;background:#111;color:#fff;
      display:grid;place-items:center;font-size:14px;
    }
    .nav{display:grid;gap:8px}
    .nav-item{
      padding:12px 14px;border-radius:14px;color:#555;text-decoration:none;
    }
    .nav-item.active{background:#fff;color:#111;font-weight:700;box-shadow:0 4px 18px rgba(0,0,0,.04)}
    .sidebar-foot{
      margin-top:auto;padding:16px;border:1px solid var(--line);border-radius:18px;background:#fff;
    }
    .sidebar-foot strong{display:block;font-size:24px;margin-bottom:4px}
    .sidebar-foot span{font-size:12px;color:var(--muted)}
    main{
      min-width:0;
      padding:30px 38px 50px;
      display:flex;
      justify-content:center;
    }
    .shell{width:min(940px,100%)}
    .topbar{
      display:flex;justify-content:space-between;align-items:center;
      margin-bottom:22px;
    }
    .today{font-size:13px;color:var(--muted);font-weight:700;letter-spacing:.08em;text-transform:uppercase}
    .daily{font-size:13px;color:var(--muted)}
    .progress-wrap{margin-bottom:18px}
    .progress-head{display:flex;justify-content:space-between;gap:20px;font-size:12px;color:var(--muted);margin-bottom:8px}
    .progress{height:6px;background:#e6e6df;border-radius:999px;overflow:hidden}
    .progress > div{height:100%;width:0;background:#111;border-radius:inherit;transition:width .35s ease}
    .stage{
      min-height:680px;
      border:1px solid var(--line);
      border-radius:34px;
      background:var(--surface);
      box-shadow:var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .stage-head{
      padding:24px 28px 0;
      display:flex;justify-content:space-between;align-items:center;
    }
    .eyebrow{
      font-size:12px;color:var(--muted);font-weight:800;letter-spacing:.12em;text-transform:uppercase
    }
    .pill{
      font-size:12px;padding:8px 10px;border-radius:999px;background:var(--surface-2);color:#666;
    }
    .content{
      flex:1;
      padding:46px 64px 32px;
      display:flex;
      flex-direction:column;
      justify-content:center;
      align-items:center;
      text-align:center;
      animation:fade .28s ease;
    }
    @keyframes fade{from{opacity:.35;transform:translateY(5px)}to{opacity:1;transform:none}}
    h1,h2,p{margin-top:0}
    .word{
      font-size:68px;line-height:1;letter-spacing:-.055em;margin-bottom:14px;
    }
    .phonetic{font-size:16px;color:var(--muted);margin-bottom:34px}
    .lead{
      font-size:22px;line-height:1.55;max-width:650px;margin-bottom:24px;
    }
    .scene{
      max-width:680px;
      font-size:26px;
      line-height:1.65;
      letter-spacing:-.025em;
      text-wrap:balance;
    }
    .scene .spoken{font-weight:700}
    .scene-note{
      margin-top:22px;color:var(--muted);font-size:15px;max-width:560px;line-height:1.6
    }
    .question{
      font-size:15px;font-weight:800;margin-top:34px;margin-bottom:14px;
    }
    .choices{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
    .choice{
      border:1px solid var(--line);background:#fff;color:#222;padding:13px 18px;border-radius:14px;cursor:pointer;
      transition:.18s ease;min-width:110px;
    }
    .choice:hover{transform:translateY(-1px);border-color:#bdbdb4}
    .choice.selected{background:#111;color:#fff;border-color:#111}
    .feedback{
      margin-top:18px;min-height:44px;max-width:580px;
      font-size:14px;line-height:1.55;color:var(--muted)
    }
    .feedback.good{color:var(--good)}
    .feedback.bad{color:var(--bad)}
    .reveal{
      display:grid;gap:18px;max-width:640px;
    }
    .reveal .symbol{
      font-size:72px;letter-spacing:-.055em;font-weight:800;
    }
    .reveal .meaning{
      font-size:23px;line-height:1.5;
    }
    .reveal .gloss{
      font-size:15px;color:var(--muted);
      padding-top:2px;
    }
    .contrast-grid{
      width:min(720px,100%);
      display:grid;grid-template-columns:1fr 1fr;gap:14px;
      margin-top:24px;text-align:left;
    }
    .mini{
      border:1px solid var(--line);border-radius:20px;padding:22px;background:var(--surface-2);
    }
    .mini strong{display:block;margin-bottom:8px}
    .mini p{margin:0;color:#4f4f4a;line-height:1.55;font-size:14px}
    .footer{
      padding:18px 24px 24px;
      border-top:1px solid var(--line);
      display:flex;justify-content:space-between;align-items:center;gap:12px;
    }
    .hint{font-size:12px;color:var(--muted)}
    .actions{display:flex;gap:10px;margin-left:auto}
    .btn{
      border:0;border-radius:14px;padding:13px 18px;font-weight:750;cursor:pointer;
    }
    .btn.secondary{background:#f1f1ed;color:#222}
    .btn.primary{background:#111;color:#fff;min-width:110px}
    .btn:disabled{opacity:.35;cursor:not-allowed}
    .result{
      display:grid;place-items:center;gap:12px;
    }
    .check{
      width:72px;height:72px;border-radius:50%;background:#111;color:#fff;display:grid;place-items:center;font-size:32px;
    }
    .result h2{font-size:36px;letter-spacing:-.04em;margin:10px 0 0}
    .result p{color:var(--muted);max-width:520px;line-height:1.6}
    .tagline{font-size:12px;color:var(--muted);margin-top:10px}
    .tiny-word{font-weight:800}
    @media(max-width:820px){
      .app{grid-template-columns:1fr}
      .sidebar{display:none}
      main{padding:16px}
      .stage{min-height:calc(100vh - 95px);border-radius:24px}
      .content{padding:34px 24px 24px}
      .word{font-size:54px}
      .scene{font-size:22px}
      .contrast-grid{grid-template-columns:1fr}
      .topbar{margin-top:4px}
      .footer{position:sticky;bottom:0;background:#fff}
    }
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand"><span class="brand-mark">S</span>SceneLex</div>
    <nav class="nav">
      <a class="nav-item active" href="#">今日学习</a>
      <a class="nav-item" href="#">复习</a>
      <a class="nav-item" href="#">已理解词汇</a>
    </nav>
    <div class="sidebar-foot">
      <strong>12 / 30</strong>
      <span>今日学习进度</span>
    </div>
  </aside>

  <main>
    <div class="shell">
      <div class="topbar">
        <div class="today">Today · Learning</div>
        <div class="daily">第 13 个词 · 预计 45 秒</div>
      </div>

      <div class="progress-wrap">
        <div class="progress-head">
          <span id="progressLabel">准备开始</span>
          <span id="progressCount">0 / 8</span>
        </div>
        <div class="progress"><div id="progressBar"></div></div>
      </div>

      <section class="stage">
        <div class="stage-head">
          <div class="eyebrow" id="stageEyebrow">Word</div>
          <div class="pill" id="modePill">理解模式</div>
        </div>

        <div class="content" id="content"></div>

        <div class="footer">
          <div class="hint" id="hint">先理解，再记住。</div>
          <div class="actions">
            <button class="btn secondary" id="backBtn">返回</button>
            <button class="btn primary" id="nextBtn">开始理解</button>
          </div>
        </div>
      </section>
      <div class="tagline">Prototype · Experience first, symbol second.</div>
    </div>
  </main>
</div>

<script>
const steps = [
  {
    type: "intro",
    eyebrow: "Word",
    render: () => `
      <div>
        <h1 class="word">reluctant</h1>
        <div class="phonetic">/rɪˈlʌktənt/</div>
        <p class="lead">这次先不看中文释义。<br>用几十秒，直接认识这个词在什么样的经验里出现。</p>
      </div>
    `,
    next: "开始理解",
    label: "准备开始"
  },
  {
    type: "experience",
    eyebrow: "Experience",
    render: () => `
      <div>
        <div class="scene">
          Your manager asks:<br><br>
          <span class="spoken">“Can you lead tomorrow’s presentation?”</span><br><br>
          Alex pauses.<br>
          <span class="spoken">“...I guess I can.”</span>
        </div>
        <div class="question">Alex 想做这件事吗？</div>
        <div class="choices">
          <button class="choice" data-answer="0">想</button>
          <button class="choice" data-answer="1">不太想</button>
        </div>
        <div class="feedback" id="feedback"></div>
      </div>
    `,
    requiresChoice: true,
    correct: "1",
    feedbackGood: "对。先只记住这种“行动摆在面前，但主观意愿是负的”感觉。",
    feedbackBad: "再看一次他的停顿和 “I guess I can.” —— 重点不是能力，而是意愿。",
    next: "继续",
    label: "经验 1"
  },
  {
    type: "experience",
    eyebrow: "Experience",
    render: () => `
      <div>
        <div class="scene">
          <span class="spoken">“Come to dinner with us.”</span><br><br>
          Maya looks tired.<br>
          <span class="spoken">“I really don't feel like going.”</span><br><br>
          Ten minutes later, she puts on her coat.
        </div>
        <div class="scene-note">换了人物、关系和行动，但有一个心理结构没有变。</div>
      </div>
    `,
    next: "我看到了",
    label: "经验 2"
  },
  {
    type: "perturb",
    eyebrow: "Try the boundary",
    render: () => `
      <div>
        <div class="scene">
          Daniel didn't really want to move abroad.<br><br>
          After thinking about it for a week,<br>
          <strong>he decided to stay.</strong>
        </div>
        <div class="question">和前面的核心状态还是同一类吗？</div>
        <div class="choices">
          <button class="choice" data-answer="1">是</button>
          <button class="choice" data-answer="0">不是，因为最后没做</button>
        </div>
        <div class="feedback" id="feedback"></div>
      </div>
    `,
    requiresChoice: true,
    correct: "1",
    feedbackGood: "对。最后做没做，不是这个词义成立的必要条件。",
    feedbackBad: "这正是一个常见误解：行动结果不是核心。核心仍然是面对行动时缺乏意愿。",
    next: "继续",
    label: "修正假设"
  },
  {
    type: "reveal",
    eyebrow: "Name the experience",
    render: () => `
      <div class="reveal">
        <div class="symbol">reluctant</div>
        <div class="meaning">英语通常用这个词，来表达一个人面对某个行动或选择时，<strong>并不真正愿意去做</strong>的状态。</div>
        <div class="gloss">not really willing to do something · 常译：不情愿的 / 勉强的</div>
      </div>
    `,
    next: "看看边界",
    label: "符号揭示"
  },
  {
    type: "contrast",
    eyebrow: "Contrast",
    render: () => `
      <div>
        <div class="scene">
          Emma wants to answer the question,<br>
          but she's afraid her answer may be wrong.<br><br>
          She raises her hand, then lowers it again.
        </div>
        <div class="question">这里更接近 reluctant 吗？</div>
        <div class="choices">
          <button class="choice" data-answer="0">是</button>
          <button class="choice" data-answer="1">不是</button>
        </div>
        <div class="feedback" id="feedback"></div>
        <div class="contrast-grid">
          <div class="mini"><strong>reluctant</strong><p>主要是“不太愿意做”。</p></div>
          <div class="mini"><strong>hesitant</strong><p>更可能是“想做，但因为不确定、害怕或犹豫而停住”。</p></div>
        </div>
      </div>
    `,
    requiresChoice: true,
    correct: "1",
    feedbackGood: "对。她未必不愿意回答，核心更像 uncertainty / hesitation。",
    feedbackBad: "这里最突出的不是 unwillingness，而是对答案正确与否的不确定。",
    next: "继续",
    label: "塑造边界"
  },
  {
    type: "transfer",
    eyebrow: "New situation",
    render: () => `
      <div>
        <div class="scene">
          Your company offers you a promotion,<br>
          but it requires moving abroad.<br><br>
          You dislike the idea of leaving your family.<br>
          After several days, you accept.
        </div>
        <div class="question">哪个词最适合描述你的态度？</div>
        <div class="choices">
          <button class="choice" data-answer="1">reluctant</button>
          <button class="choice" data-answer="0">excited</button>
          <button class="choice" data-answer="0">careless</button>
        </div>
        <div class="feedback" id="feedback"></div>
      </div>
    `,
    requiresChoice: true,
    correct: "1",
    feedbackGood: "✓ 你已经能把这个词迁移到一个没见过的新经验里了。",
    feedbackBad: "注意你的态度：你最后接受了，但对搬走这件事本身并不愿意。",
    next: "完成",
    label: "迁移测试"
  },
  {
    type: "done",
    eyebrow: "Understood",
    render: () => `
      <div class="result">
        <div class="check">✓</div>
        <h2>你已经理解 <span class="tiny-word">reluctant</span></h2>
        <p>不是因为记住了一句中文释义，而是因为你已经能识别它所对应的经验结构，并把它迁移到新情境。</p>
      </div>
    `,
    next: "下一个词",
    label: "完成"
  }
];

let index = 0;
let answered = false;

const content = document.getElementById("content");
const nextBtn = document.getElementById("nextBtn");
const backBtn = document.getElementById("backBtn");
const eyebrow = document.getElementById("stageEyebrow");
const progressBar = document.getElementById("progressBar");
const progressLabel = document.getElementById("progressLabel");
const progressCount = document.getElementById("progressCount");
const hint = document.getElementById("hint");

function render(){
  const step = steps[index];
  answered = !step.requiresChoice;
  content.innerHTML = step.render();
  eyebrow.textContent = step.eyebrow;
  nextBtn.textContent = step.next;
  nextBtn.disabled = !!step.requiresChoice;
  backBtn.disabled = index === 0;
  progressLabel.textContent = step.label;
  progressCount.textContent = `${index} / ${steps.length-1}`;
  progressBar.style.width = `${(index/(steps.length-1))*100}%`;
  hint.textContent = index === 0 ? "先理解，再记住。" :
                     step.type === "done" ? "理解完成。" :
                     "不要急着翻译，先判断这个经验。";

  document.querySelectorAll(".choice").forEach(btn=>{
    btn.addEventListener("click", ()=>{
      document.querySelectorAll(".choice").forEach(b=>b.classList.remove("selected"));
      btn.classList.add("selected");
      answered = true;
      nextBtn.disabled = false;
      const fb = document.getElementById("feedback");
      const ok = btn.dataset.answer === step.correct;
      fb.textContent = ok ? step.feedbackGood : step.feedbackBad;
      fb.className = "feedback " + (ok ? "good" : "bad");
    });
  });
}

nextBtn.addEventListener("click", ()=>{
  if(index === steps.length-1){
    index = 0;
    render();
    return;
  }
  if(!answered) return;
  index++;
  render();
});

backBtn.addEventListener("click", ()=>{
  if(index > 0){
    index--;
    render();
  }
});

render();
</script>
</body>
</html>
