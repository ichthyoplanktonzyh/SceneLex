{% extends "base.html" %}
{% block title %}词典 · SceneLex 审核工作台{% endblock %}
{% block content %}

<section class="panel">
  <h2>词典 <span class="count" id="word-count"></span></h2>
  <p class="legend">
    <span class="badge pub">n</span> 正式库
    <span class="badge dra">+n</span> 待审草稿
    <span class="badge none">—</span> 缺失
  </p>
  <table class="board" id="dict-table">
    <thead>
      <tr>
        <th>词目</th><th>词性</th><th>义项</th><th class="num">场景</th>
        {% for t in SCENE_TYPES %}<th class="num">{{ SCENE_TYPE_LABELS[t] }}</th>{% endfor %}
      </tr>
    </thead>
    <tbody id="dict-body">
    </tbody>
  </table>
</section>

<script>
const SCENE_TYPES = {{ SCENE_TYPES|tojson|safe }};

async function loadDict() {
  const res = await fetch('/api/dict');
  const data = await res.json();
  document.getElementById('word-count').textContent = data.total + ' 词';

  const tbody = document.getElementById('dict-body');
  for (const w of data.words) {
    const tr = document.createElement('tr');

    // 词目 + 链接
    const tdWord = document.createElement('td');
    const link = document.createElement('a');
    link.className = 'sense-link';
    link.href = `/words/${w.word}`;
    link.textContent = w.word;
    tdWord.appendChild(link);
    tr.appendChild(tdWord);

    // 词性
    const tdPos = document.createElement('td');
    tdPos.textContent = w.pos.join(', ');
    tr.appendChild(tdPos);

    // 义项数
    const tdSenses = document.createElement('td');
    tdSenses.className = 'num';
    tdSenses.textContent = w.sense_count;
    tr.appendChild(tdSenses);

    // 场景合计
    const tdScenes = document.createElement('td');
    tdScenes.className = 'num total';
    tdScenes.textContent = w.scene_count;
    tr.appendChild(tdScenes);

    // 各类型场景
    for (const t of SCENE_TYPES) {
      const td = document.createElement('td');
      td.className = 'num';
      const total = w.senses.reduce((acc, s) => acc + ((s.scene_types && s.scene_types[t]) || 0), 0);
      const draftN = w.senses.reduce((acc, s) => acc + (s.source === 'draft' ? ((s.scene_types && s.scene_types[t]) || 0) : 0), 0);
      if (total > 0) {
        const pub = document.createElement('span');
        pub.className = 'badge pub';
        pub.textContent = total - draftN;
        td.appendChild(pub);
        if (draftN > 0) {
          const dra = document.createElement('span');
          dra.className = 'badge dra';
          dra.textContent = '+' + draftN;
          td.appendChild(dra);
        }
      } else {
        const none = document.createElement('span');
        none.className = 'badge none';
        none.textContent = '\u2014';
        td.appendChild(none);
      }
      tr.appendChild(td);
    }

    tbody.appendChild(tr);
  }
}
loadDict();
</script>

{% endblock %}
