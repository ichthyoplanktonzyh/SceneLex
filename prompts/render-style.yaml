# SceneLex 全库统一渲染风格。风格只属于 Director / Renderer，绝不进入 WordSense 或 SceneSpec。
# `director_instruction` 注入 Director 提示模板；`positive` / `negative` 兼容旧 render.py 图像流程。
id: pixar-3d
director_instruction: >-
  Use a Pixar-style 3D animated film look as the primary visual direction:
  appealing stylized characters, expressive readable eyes and brows, clear
  exaggerated but believable body language, warm cinematic family-film
  lighting, polished 3D materials, rich color, strong visual storytelling,
  humorous and emotionally readable staging. Preserve the exact characters,
  setting, actions, causality, and semantic evidence already specified by the
  SceneSpec; style the existing scene, do not invent a new story.
positive: >-
  Pixar-style 3D animated film, appealing stylized 3D characters,
  expressive readable eyes and brows, clear exaggerated body language,
  warm cinematic family-film lighting, polished 3D materials, rich color,
  strong visual storytelling, emotionally readable staging, high detail
negative: >-
  2d anime, flat illustration, cel shading, photorealistic live action,
  plastic toy render, text, english text, speech bubble, caption, subtitles,
  letters, watermark, signature, username, lowres, bad anatomy, bad hands,
  extra digits, fewer digits, jpeg artifacts, blurry, unreadable expression
