services:
  postgres:
    image: postgres:18
    container_name: scenelex-postgres
    environment:
      POSTGRES_USER: scenelex
      POSTGRES_PASSWORD: scenelex
      POSTGRES_DB: scenelex
    ports:
      - "5432:5432"
    volumes:
      - scenelex_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scenelex -d scenelex"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  scenelex_pgdata:
